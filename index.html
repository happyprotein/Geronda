<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--font-d:'Fraunces','Noto Serif',Georgia,serif;--font-b:'Nunito','Noto Serif',sans-serif;--font-cyr:'Noto Serif',Georgia,serif;}
/* Ćirilica — koristi Noto Serif za lijep render pravoslavnog teksta */
@font-face{font-family:'CyrDisplay';src:local('Noto Serif'),local('Georgia');unicode-range:U+0400-04FF,U+0500-052F,U+2DE0-2DFF,U+A640-A69F;}
body[data-theme="light"]{
--bg:#F5F0E4;--bgGrad:linear-gradient(180deg,#F5F0E4 0%,#EBEEDF 50%,#E0EAD8 100%);
--bgCard:rgba(255,255,255,.55);--surface:rgba(255,255,255,.5);--surfaceL:rgba(181,207,160,.25);--bgHover:rgba(255,255,255,.75);
--text:#3D5938;--textM:#5D7656;--textD:#7A8B73;
--accent:#7BA577;--accentD:#5C8B5A;--warm:#E8C796;--warmD:#D4A569;
--danger:#D4736A;--good:#7BA577;--mid:#E8C796;
--cardBorder:rgba(181,207,160,.25);--cardShadow:0 4px 16px rgba(107,135,101,.08);
--scrollThumb:rgba(122,139,115,.3);
}
body[data-theme="dark"]{
--bg:#1B2924;--bgGrad:linear-gradient(180deg,#1B2924 0%,#1F2E26 50%,#243329 100%);
--bgCard:rgba(255,255,255,.05);--surface:rgba(255,255,255,.05);--surfaceL:rgba(181,207,160,.12);--bgHover:rgba(255,255,255,.08);
--text:#E8EDD9;--textM:#BDD0AC;--textD:#9DB591;
--accent:#95C088;--accentD:#B5CFA0;--warm:#F5D88B;--warmD:#E8C796;
--danger:#E89B92;--good:#A8D199;--mid:#F5D88B;
--cardBorder:rgba(181,207,160,.15);--cardShadow:none;
--scrollThumb:rgba(157,181,145,.3);
}
html,body,#root{height:100%;color:var(--text);font-family:var(--font-b);transition:color .4s ease}
body{background:var(--bgGrad);background-attachment:fixed;overscroll-behavior:none;transition:background .4s ease}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--scrollThumb);border-radius:2px}
input,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--textD)}
textarea{resize:vertical}
input[type=range]{height:4px;-webkit-appearance:none;appearance:none;background:var(--surfaceL);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}

/* Install banner */
.install-banner{position:fixed;bottom:20px;left:20px;right:20px;padding:16px 20px;background:var(--bgCard);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--cardBorder);border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:100;animation:slideUp .4s ease;box-shadow:var(--cardShadow)}
.install-banner button{padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.install-btn{background:var(--accent);color:#fff}
.dismiss-btn{background:transparent;color:var(--textM)}
@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Page container */
.page{max-width:440px;margin:0 auto;padding:env(safe-area-inset-top,20px) 20px 40px;min-height:100vh;position:relative;z-index:1}

/* Shared */
.back-btn{background:none;border:none;color:var(--textM);font-size:14px;cursor:pointer;padding:4px 0;font-family:inherit}
.primary-btn{padding:14px 32px;border-radius:28px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;box-shadow:0 2px 8px rgba(123,165,119,.25)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(123,165,119,.35)}
.primary-btn:active{transform:translateY(0);opacity:.85}
.secondary-btn{padding:14px 32px;border-radius:28px;border:1px solid var(--cardBorder);background:var(--bgCard);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill{padding:6px 14px;border-radius:20px;border:none;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.card{padding:16px 20px;background:var(--bgCard);border-radius:18px;border:1px solid var(--cardBorder);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--cardShadow);transition:all .3s}
.section-label{font-size:11px;color:var(--textD);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600}
.h2{margin:0;color:var(--text);font-family:var(--font-d);font-weight:400;font-size:28px;text-align:center;letter-spacing:0.3px}

/* Dot animation */
.dots{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* Breathe circle */
/* Breath orb — multi-layered animated breathing visual */
.breath-orb-wrap{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.breath-orb-glow{position:absolute;inset:-20px;border-radius:50%;filter:blur(24px);opacity:.55;transition:all 1s cubic-bezier(.4,0,.2,1)}
.breath-orb-glow.slow{transition-duration:6s}
.breath-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid;opacity:.4;animation:orb-rotate 18s linear infinite}
.breath-orb-ring-2{position:absolute;inset:14px;border-radius:50%;border:1px solid;opacity:.3;animation:orb-rotate 24s linear infinite reverse}
.breath-orb-core{position:relative;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s cubic-bezier(.4,0,.2,1);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.15) 0%,transparent 60%)}
.breath-orb-core.slow{transition-duration:6s}
.breath-orb-core.idle{transition-duration:.4s}
@keyframes orb-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orb-pulse{0%,100%{opacity:.4}50%{opacity:.7}}
.breath-orb-particles{position:absolute;inset:0;border-radius:50%;pointer-events:none;overflow:hidden}
.breath-particle{position:absolute;border-radius:50%;background:currentColor;opacity:0;animation:particle-drift 3s ease-out infinite}
@keyframes particle-drift{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.6}100%{transform:translate(var(--dx,0),var(--dy,0)) scale(1.2);opacity:0}}

/* Respect motion preferences — disable decorative animations */
@media (prefers-reduced-motion: reduce){
  .breath-orb-ring,.breath-orb-ring-2,.anim-moon,.anim-sun,.anim-tree-1,.anim-tree-2,.anim-tree-3,.anim-cloud,.anim-cloud-2,.anim-star,.anim-star-2,.anim-star-3{animation:none !important}
  .breath-orb-glow,.breath-orb-core{transition-duration:.4s !important}
}

/* CBT progress orb — circular SVG with gentle fill animation */
.progress-orb-wrap{display:flex;align-items:center;gap:12px}
.progress-orb-svg{width:36px;height:36px;flex-shrink:0}
.progress-orb-track{fill:none;stroke:var(--surfaceL);stroke-width:3}
.progress-orb-fill{fill:none;stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
.progress-orb-pulse{animation:progress-pulse 2.4s ease-in-out infinite}
@keyframes progress-pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){
  .progress-orb-pulse{animation:none}
}

/* NSDR / Body Scan silhouette */
.body-silhouette{position:relative;width:80px;height:200px;flex-shrink:0;margin:0 auto}
.body-silhouette svg{width:100%;height:100%;overflow:visible}
.body-region{transition:fill .8s ease,filter .8s ease,opacity .8s ease;fill:var(--surfaceL);opacity:.5}
.body-region.active{fill:var(--accent);opacity:.85;filter:drop-shadow(0 0 10px var(--accent))}
.body-region.glow{animation:body-pulse 3s ease-in-out infinite}
@keyframes body-pulse{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 16px var(--accent))}}
@media (prefers-reduced-motion: reduce){
  .body-region{transition-duration:.3s}
  .body-region.glow{animation:none}
}

/* Soundscape visualizers */
.sound-viz{position:relative;height:60px;border-radius:12px;overflow:hidden;margin-top:10px;background:var(--surface);border:1px solid var(--surfaceL)}
.sound-viz svg{width:100%;height:100%;display:block}
@keyframes rain-fall{0%{transform:translateY(-10px);opacity:0}20%{opacity:.7}100%{transform:translateY(80px);opacity:0}}
.rain-drop{animation:rain-fall 1.4s linear infinite}
@keyframes wave-roll{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
.wave-line{animation:wave-roll 4s ease-in-out infinite}
@keyframes wind-drift{0%{transform:translateX(-30px);opacity:0}30%{opacity:.6}100%{transform:translateX(360px);opacity:0}}
.wind-wisp{animation:wind-drift 6s ease-in-out infinite}
@keyframes drone-pulse{0%,100%{r:10;opacity:.5}50%{r:18;opacity:.3}}
.drone-pulse{animation:drone-pulse 4s ease-in-out infinite}
@keyframes binaural-l{0%,100%{r:6;opacity:.7}50%{r:9;opacity:1}}
@keyframes binaural-r{0%,100%{r:6;opacity:.7}45%{r:9;opacity:1}}
.binaural-l{animation:binaural-l 1.8s ease-in-out infinite}
.binaural-r{animation:binaural-r 1.85s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .rain-drop,.wave-line,.wind-wisp,.drone-pulse,.binaural-l,.binaural-r{animation:none !important}
}

/* Micro-moments — small celebrations and breaths of life */
/* Logo subtle wink/bounce every ~30s */
@keyframes logo-blink{0%,93%,100%{transform:scale(1)}96%{transform:scale(.96) translateY(2px)}}
.logo-alive{animation:logo-blink 32s ease-in-out infinite}
/* Step completion glow flash */
@keyframes complete-glow{0%{box-shadow:0 0 0 0 rgba(123,165,119,0)}50%{box-shadow:0 0 30px 8px rgba(123,165,119,.4)}100%{box-shadow:0 0 0 0 rgba(123,165,119,0)}}
.complete-glow{animation:complete-glow 1.4s ease-out}
/* Soft confetti for streak milestones */
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(120px) rotate(540deg);opacity:0}}
.confetti-piece{position:absolute;width:6px;height:6px;border-radius:1px;animation:confetti-fall 2.5s ease-out forwards;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .logo-alive,.complete-glow{animation:none !important}
}

/* Geronda hero portrait — soft fade into the page, gentle breathing */
.geronda-hero{position:relative;height:290px;line-height:0;-webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,#000 74%,transparent 100%);animation:hero-breathe 9s ease-in-out infinite;transform-origin:50% 100%}
.geronda-hero .g-base{height:100%;width:auto;display:block}
.g-ov{position:absolute;opacity:0;pointer-events:none;max-width:none;display:block}
/* трептај — сваких ~6 s, око 170 ms */
.g-b1{animation:g-b1 5.8s linear infinite}
.g-b2{animation:g-b2 5.8s linear infinite}
@keyframes g-b1{0%,94%{opacity:0}94.5%{opacity:1}95.1%{opacity:0}96.3%{opacity:1}97%,100%{opacity:0}}
@keyframes g-b2{0%,94.7%{opacity:0}95.1%,96%{opacity:1}96.4%,100%{opacity:0}}
/* благи осмијех — сваких 15 s, траје ~4 s */
.g-s1{animation:g-s1 15s ease-in-out infinite}
.g-s2{animation:g-s2 15s ease-in-out infinite}
.g-s3{animation:g-s3 15s ease-in-out infinite}
@keyframes g-s1{0%,30%{opacity:0}33%,67%{opacity:1}70%,100%{opacity:0}}
@keyframes g-s2{0%,33%{opacity:0}36%,64%{opacity:1}67%,100%{opacity:0}}
@keyframes g-s3{0%,36%{opacity:0}39%,61%{opacity:1}64%,100%{opacity:0}}
@keyframes hero-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@media (prefers-reduced-motion: reduce){.geronda-hero,.g-ov{animation:none}}
/* Old breathe-circle kept for backwards compat but unused */
.breathe-circle{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s cubic-bezier(.4,0,.2,1)}
.breathe-circle.slow{transition-duration:6s}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-card{padding:16px 10px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:18px;cursor:pointer;text-align:center;transition:all .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--cardShadow)}
.action-card:hover{transform:translateY(-2px);background:var(--bgHover)}
.action-card:active{transform:translateY(0);background:var(--bgHover)}

/* Top bar */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;max-width:440px;margin:0 auto;position:relative;z-index:10}
.brand-top{font-size:10px;color:var(--accentD);font-weight:600;letter-spacing:1.5px}
.toggle-group{display:flex;gap:8px;align-items:center}
.lang-toggle,.theme-toggle{display:flex;gap:2px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:14px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang-btn,.theme-btn{padding:4px 10px;border-radius:11px;border:none;font-size:11px;font-weight:600;cursor:pointer;transition:all .25s;background:transparent;color:var(--textD);font-family:inherit}
.lang-btn.active{background:var(--accent);color:#fff}
.theme-btn{padding:4px 8px;font-size:13px;line-height:1}
.theme-btn.active{background:var(--accent);color:#fff}

/* Animated scenes */
.scene-bg{position:fixed;top:0;left:0;right:0;height:200px;pointer-events:none;z-index:0;overflow:hidden;opacity:.85;mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%)}
.scene-bg svg{width:100%;height:100%;display:block}
@keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes drift{0%{transform:translateX(-30px)}100%{transform:translateX(440px)}}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-moon{animation:float-y 6s ease-in-out infinite;transform-origin:center}
.anim-sun{animation:float-y 7s ease-in-out infinite;transform-origin:center}
.anim-tree-1{animation:sway 5.5s ease-in-out infinite;transform-origin:bottom center}
.anim-tree-2{animation:sway 6.5s ease-in-out infinite -2s;transform-origin:bottom center}
.anim-tree-3{animation:sway 5s ease-in-out infinite -3.5s;transform-origin:bottom center}
.anim-cloud{animation:drift 60s linear infinite}
.anim-cloud-2{animation:drift 75s linear infinite -25s}
.anim-star{animation:twinkle 4s ease-in-out infinite}
.anim-star-2{animation:twinkle 5s ease-in-out infinite -1.5s}
.anim-star-3{animation:twinkle 6s ease-in-out infinite -3s}
.scene-bg{animation:fadeIn .6s ease}

/* Smooth theme transition for everything */
.card,.action-card,.lang-toggle,.theme-toggle,.primary-btn,.secondary-btn{transition:background .4s ease,border-color .4s ease,color .4s ease,box-shadow .4s ease,transform .25s ease}
</style>
</head>
<body data-theme="light">
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

     "Умјесто тога: престаните се борити. Сједите или лезите. Отворите руке. Омекшајте вилицу.",
     "Реците тихо: 'У реду, паника. Ту си. Не бјежим. Покажи ми шта имаш.'",
     "Посматрајте осјећаје као валове. Лупање срца — вал. Трнци у рукама — вал. Стезање — вал. Сваки се диже и пада.",
     "Паника досеже врхунац у максимално 10 минута. Ваше тијело је не може дуже одржати — остане без адреналина. Можете надживјети сваки вал.",
     "Кад олуја прође (а увијек прође), захвалите себи. Управо сте доказали да можете преживјети панику без контролисања. То мијења све."]
  ],
  social:[
    ["Примијетите мисао управо сада: 'Сви ме гледају. Осуђиват ће шта носим, како изгледам, шта говорим.'",
     "Научни налаз: студије (Гилович, 2000) показују да људи памте око 50% МАЊЕ о нама него што ми мислимо. Ми смо статисти у њиховом филму, не главни лик.",
     "Покушајте ово: сјетите се три особе које сте видјели јуче. Шта су носили? Шта су рекли? Вјероватно се не сјећате детаља — и они се не сјећају ваших.",
     "Сада изаберите једну особу у близини. Током 30 секунди проучавајте њено лице, држање, на шта је фокусирана. Примијетите — утопљена је у свој свијет, не у ваш.",
     "Поновите тихо: 'Нисам у центру пажње. Ово је слобода, не одбацивање.'",
     "Рефлектор није на вама. Никада није ни био. Можете се кретати кроз овај простор тачно онакви какви јесте."],
    ["Имате 90 секунди прије него уђете. Нађите тих кутак — купатило, ходник, паркирано ауто. Сједите или стојте мирно.",
     "Удахните кроз нос 4 секунде. Осјетите како се груди и трбух дижу.",
     "Задржите благо 4 секунде. Без напора.",
     "Издахните кроз уста 6 секунди — дуго, полако, равномјерно. Можете правити тих 'шшшш' звук ако вам помаже.",
     "Поновите овај циклус 6 пута (око 90 секунди укупно). Дуги издах активира парасимпатички нервни систем — ваше тијело прелази из 'пријетње' у 'сигурност'.",
     "Устаните. Откотрљајте рамена уназад. Један мали осмијех себи — управо сте дали нервном систему предност. Уђите."],
    ["Примијетите да то радите. 'Поново прерађујем ону интеракцију.' Само то именујте. Не осуђујте себе због размишљања — то додаје други слој.",
     "Питајте се: 'Скупљам ли корисне информације, или само себе мучим?' Будите искрени. Размишљање овог типа дјелује продуктивно али ријетко јесте.",
     "Поставите тајмер на 5 минута. Дајте себи дозволу да интензивно размишљате о томе тих 5 минута — запишите шта бисте урадили другачије.",
     "Кад тајмер истекне — затворите га. Наглас или у глави: 'Завршио сам са размишљањем које ово заслужује.'",
     "Устаните. Покрените тијело. Идите у другу собу. Полијте лице водом. Помак тијела сигнализира помак ума.",
     "Ако се мисао врати: 'Већ сам јој данас дао вријеме. Репродукција је готова.' Онда урадите нешто рукама — судове, шетњу, било шта."],
    ["Именујте страх конкретно. Не 'људи ће ме осуђивати' него 'ако наручим кафу својим нормалним гласом, баристи ће мислити да сам чудан.'",
     "Предвидите исход. Колики је % шансе да се деси? Шта би тачно урадили? Запишите: '70% шансе да баристи направи гримасу.'",
     "Дизајнирајте мали експеримент да то тестирате. Сутра наручите кафу нормално. Примијетите реакцију баристе. То је све.",
     "Покрените експеримент. Немојте 'контролисати' исход — само посматрајте шта се дешава као научник.",
     "Упоредите предвиђање са стварношћу. Да ли је баристи направио гримасу? У 95% случајева страх се не оствари — а и кад се деси, много је мањи од замишљеног.",
     "Ажурирајте своје увјерење. Не 'људи ме не осуђују' (преапсолутно) него 'прецијенио сам пријетњу. Свијет је углавном равнодушан, на добар начин.'"],
    ["Слушајте шта је ваш унутрашњи глас управо рекао. Можда: 'Звучао си тако глупо. Зашто си то рекао? Сви су примијетили.'",
     "Замислите да вам је блиски пријатељ рекао да има исту ту мисао. Шта бисте му рекли?",
     "Вјероватно му не бисте рекли 'да, ЈЕСИ глуп.' Вјероватно бисте рекли: 'Није било тако лоше. Људи нису пажљиво гледали. И ја то стално радим.'",
     "Сада окрените тај глас према себи. Реците тихо или наглас: [шта год бисте рекли пријатељу]",
     "Примијетите отпор. Нормално је осјећати 'али заслужујем оштрину.' Тај глас је негдје научен — није истина.",
     "Поновите једну реченицу: 'Говорићу себи онако како бих говорио некоме кога волим.' Ово није слабост. Ово је темељ отпорности."],
    ["Идентификујте циљ који дјелује немогуће. 'Стећи нове пријатеље.' 'Причати на састанцима.' 'Ићи на друштвене догађаје сам.'",
     "Сад га разбијте на 5 степена од најлакшег до најтежег. Примјер за 'Причати на састанцима': Степен 1 рећи добро јутро, Степен 2 поставити питање, Степен 3 подијелити мишљење, Степен 4 пристојно се не сложити, Степен 5 водити дискусију.",
     "Изаберите Степен 1. Радите САМО Степен 1 ове седмице. Немојте прескакати. Немојте покушавати 'бити храбрији.'",
     "Сваки пут кад завршите степен, оцијените стварну тежину (1-10) НАКОН, и забиљежите шта се десило.",
     "Након 5–7 успјешних понављања једног степена, пређите на сљедећи. Страх природно блиједи кроз понављање, не кроз вољу.",
     "Пењање ових љестава траје седмицама или мјесецима. То није споро — тако се мозак преусмјерава. Вјерујте процесу."],
    ["Данашња микро-вјежба. Изаберите ЈЕДНО од ових (само једно): направите контакт очима са касиром и реците хвала, држите контакт очима 1 секунду дуже при поздрављању, подијелите једно кратко мишљење у малој групи, или питајте странца неко мало питање.",
     "Акција траје мање од 30 секунди. Ишчекивање може трајати 30 минута — то је нормално. Примијетите јаз.",
     "Урадите то. Немојте чекати да се осјећате спремно. Акција прва, самопоуздање касније.",
     "Након: посматрајте како сте се заиста осјећали током, не како сте предвидјели. Обично мање страшно.",
     "Примијетите ако ваш унутрашњи глас покуша рећи 'то је било мало, не рачуна се.' РАЧУНА СЕ. Свако понављање је важно.",
     "Сутра: изаберите једну другачију микро-акцију. Циљ није осјећати се угодно — циљ је дјеловати упркос нелагоди. Удобност слиједи акцију, не обрнуто."],
    ["Запишите 3 реченице које можете рећи себи прије догађаја. Не лажи, не афирмације — истините ствари.",
     "Реченица 1 — о ситуацији: 'Већина социјалних интеракција прође у реду. Већ сам ово радио/ла.' Или: 'Чак и ако прође лоше, преживјет ћу.'",
     "Реченица 2 — о себи: 'Смијем бити тих/а. Смијем отићи. Смијем бити неугодно и бити у реду.'",
     "Реченица 3 — о другима: 'Већина људи је љубазна, анксиозна око себе, или равнодушна. Мало њих ме критички гледа.'",
     "Прочитајте све три наглас или у глави 3 пута. Прочитајте их поново непосредно прије уласка. Ваш мозак треба сценариј.",
     "Након догађаја, вратите се овој картици. Да ли су се најгори сценарији остварили? Ажурирајте реченице на основу стварних доказа, не анксиозне маште."]
  ],
  stress:[
    ["Затворите очи. Замислите спремник — било шта. Дрвену кутију. Сеф. Собу. Није важно шта, али направите га конкретним.",
     "Сад помислите на све што вас притиска управо сада. Набројте тихо или наглас. Посао. Породица. Онај имејл. Ствар коју сте заборавили.",
     "Једну по једну, њежно поставите сваку ствар у спремник. Не бацате — постављате, са поштовањем према свакој.",
     "Кад све буде унутра, затворите спремник. Закључајте га ако требате. Ствари су сигурне — нису нестале, само су похрањене.",
     "Поставите вријеме кад ћете поново отворити спремник. 'Сутра у 9 ујутро ћу се бавити овим.' Ово је обећање себи, не бијег.",
     "Управо сада, ваш ум смије да се одмори. Посао није изгубљен — похрањен је. До тада, ви сте слободни."],
    ["Стрес који не одлази кроз размишљање живи у тијелу. Пустит ћемо га кроз тијело.",
     "Устаните. Стегните СВЕ мишиће одједном — песнице, рамена, вилицу, ноге. Држите 5 секунди. Стегните још јаче.",
     "Сад отпустите. Пустите све. Спустите рамена. Отворите руке. Осјетите контраст.",
     "Сад се тресите. Само тресите руке, рамена, ноге, цијело тијело 30 секунди. Животиње то раде након пријетње — то ослобађа похрањени стрес.",
     "Дубоко удахните 3 пута. Примијетите — тијело се осјећа другачије. Можда трнци, топло, или само празније.",
     "Стрес је енергија. Енергија мора да се креће. Управо сте јој дали излаз. Ум ће слиједити."],
    ["Узмите папир. Нацртајте два ступца: ДАЈЕ енергију и ОДУЗИМА енергију.",
     "Помислите на протеклу седмицу. Набројте све што сте радили, у оба ступца. Будите конкретни. Не 'људи' — 'састанак са М.'",
     "Погледајте ступац ДАЈЕ. Шта је ту? Прочитајте сваку ставку. Ово су ваши извори обнављања. Нису опционални.",
     "Погледајте ступац ОДУЗИМА. Заокружите оне које дјелују неизбјежно. Означите звјездицом оне над којима имате контролу.",
     "Изаберите ЈЕДНУ ставку из које црпите енергију над којом имате контролу. Шта је најмања промјена коју можете направити? Прескочити је једном. Смањити за 20%. Премјестити за мање исцрпљен дан.",
     "Сагоријевање није о томе да превише радите. Ради се о давању више енергије него што примате. Преглед показује неравнотежу. Поправите једну ствар ове седмице."],
    ["ТИПП је DBT вјештина за кризу — користи се кад су емоције превише интензивне за размишљање. Четири дијела, кориштена заједно.",
     "Т — Температура. Држите нешто хладно на лицу — ледена вода, смрзнуто поврће, хладна крпа. 30 секунди. Ово активира рефлекс роњења и смирује срце.",
     "И — Интензивна вјежба. Трчите у мјесту. Урадите 20 скокова у мјесту раширених руку и ногу. Брзо се попните степеницама. 60 секунди. Сагоријева хемикалије стреса.",
     "П — Полако дисање. Удахните 4, издахните 8. Дужи издах је кључ. Минимум 5 циклуса.",
     "П — Парна мишићна релаксација. Стегните песнице 5 секунди. Отпустите. Стегните рамена 5 секунди. Отпустите. Прођите кроз цијело тијело.",
     "ТИПП не поправља узрок стреса. Купује вам вријеме — 20 минута јаснијег размишљања да паметно донесете сљедећу одлуку."],
    ["Сједите усправно. Затворите очи. Дишите нормално 30 секунди.",
     "Замислите планину. Вашу. Нешто конкретно — можда једну коју сте видјели, можда замишљену. Чврсту базу. Снажну средину. Врх у небу.",
     "Замислите да постајете ова планина. Ваше ноге су база. Ваш труп су падине. Ваша глава је врх.",
     "Сад замислите годишња доба како прелазе преко планине. Прољетна киша. Љетне олује. Јесењи вјетрови. Зимски снијег. Планина остаје. Увијек.",
     "Примијетите — вријеме се стално мијења. Планина се никад не мијења. Ви сте попут ње. Ваше емоције су вријеме. Ваше суштинско ја је планина.",
     "Кад дође хаос, вратите се овоме. Ви нисте олуја. Ви сте оно кроз шта олуја пролази. Стабилни. Укоријењени. Цјеловити."]
  ],
  meaning:[
    ["Шест животних подручја. Прочитајте их: Породица, Пријатељство, Посао/Учење, Здравље, Допринос другима, Духовност/смисао.",
     "Изаберите ЈЕДНО подручје које вам дјелује најважније управо сада. Само једно.",
     "Питајте се: 'Кад бих савршено живио/ла ову вриједност, како би изгледао мој живот за 5 година?' Будите конкретни. Не магловито.",
     "Сад упоредите са данас. Гдје је јаз? Не осуђујте — само примијетите.",
     "Која ЈЕДНА мала акција ове седмице би смањила тај јаз за 1%? Мање је боље.",
     "Вриједности су правац, не одредиште. Не долазите до њих. Ходате према њима, и ходање је смисао."],
    ["Замислите себе са 80 година. Проживјели сте пун живот. Сједите негдје мирно, гледате уназад.",
     "Из те перспективе, погледајте ВАС од данас. Вас који ово управо читате.",
     "Шта вам ваше ја од 80 година жели рећи? О бризи која вас троши? О људима у вашем животу? О ономе чега се држите, чему се опирете?",
     "Сад напишите писмо. Чак и само 3 реченице. Шта старији ви каже? Шта желе да знате?",
     "Примијетите — ваше ја од 80 година има перспективу коју ви сада немате. Та перспектива је стварна. Постоји. Можете је посудити.",
     "Прочитајте писмо кад заглавите. Будуће ја навија за садашње ја. Чак и кад то не можете видјети."],
    ["Стоици су носили овај подсјетник: 'Мементо мори' — сјети се да ћеш умријети. Није морбидно. Ослобађајуће.",
     "Паузирајте. Управо сада. Удахните. Умријет ћете једног дана. Можда за 60 година. Можда за 60 дана. Не знате.",
     "Погледајте бригу која вас сада троши. Хоће ли бити важна на ваш задњи дан? Будите искрени. Неке ће. Многе неће.",
     "Ствари које ЋЕ бити важне: људи које сте вољели, ствари које сте створили, како сте се понашали према другима, како сте се понашали према себи.",
     "Ствари које НЕЋЕ бити важне: већина онога што сте скроловали, већина поређења, већина малих незадовољстава, већина перфекционизма.",
     "Ово није песимизам. Супротно је. Знање да је вријеме коначно чини обично драгоцјеним. Искористите га добро данас."],
    ["DBT учи да постоје три ума у нама. Управо сада, идентификујте који је најгласнији.",
     "Емоционални ум: води се осјећајима. 'МРЗИМ ово. ЖЕЛИМ то. НЕ МОГУ то издржати.' Све истина. Све емоција.",
     "Разумски ум: води се логиком. 'Статистика каже. Про и контра. Треба и не треба.' Све истина. Све хладно.",
     "Мудри ум је интеграција. Не компромис — дубље мјесто гдје се оба поштују. И ваши осјећаји и ваше чињенице.",

function scoreLabel(type,score){
  if(type==="GAD-7"){
    if(score<=4) return{text:"Minimal",c:"var(--good)"};
    if(score<=9) return{text:"Mild",c:"var(--mid)"};
    if(score<=14) return{text:"Moderate",c:"var(--warm)"};
    return{text:"Severe",c:"var(--danger)"};
  }
  if(type==="PHQ-9"){
    if(score<=4) return{text:"Minimal",c:"var(--good)"};
    if(score<=9) return{text:"Mild",c:"var(--mid)"};
    if(score<=14) return{text:"Moderate",c:"var(--warm)"};
    if(score<=19) return{text:"Mod. Severe",c:"var(--danger)"};
    return{text:"Severe",c:"var(--danger)"};
  }
  if(score<=13) return{text:"Low",c:"var(--good)"};
  if(score<=26) return{text:"Moderate",c:"var(--mid)"};
  return{text:"High",c:"var(--danger)"};
}

function Assess({onBack}){
  const[test,setTest]=useState(null);const[ans,setAns]=useState([]);const[cur,setCur]=useState(0);const[result,setResult]=useState(null);
  const[history,setHistory]=useState(()=>store.get('assessments')||{});
  const startTest=n=>{setTest(n);setAns(new Array(TESTS[n].q.length).fill(null));setCur(0);setResult(null);};
  const answer=v=>{const u=[...ans];u[cur]=v;setAns(u);
    if(cur<TESTS[test].q.length-1){setCur(cur+1);}
    else{let total=u.reduce((a,b)=>a+b,0);
      if(test==='PSS-10'){total=u.reduce((s,v,i)=>s+([3,4,6,7].includes(i)?4-v:v),0);}
      setResult(total);
      const h={...history};if(!h[test])h[test]=[];h[test].push({s:total,d:Date.now()});
      setHistory(h);store.set('assessments',h);}};
  if(!test)return React.createElement('div',{className:'page',style:{display:'flex',flexDirection:'column',gap:20,paddingTop:8}},
    React.createElement('button',{onClick:onBack,className:'back-btn'},t('← Back')),
    React.createElement('h2',{className:'h2'},t('Assessments')),
    React.createElement('p',{style:{color:'var(--textD)',textAlign:'center',fontSize:13,maxWidth:380,margin:'0 auto'}},t('Validated screening tools. Not diagnostic — consult a professional for clinical evaluation.')),
    ...Object.entries(TESTS).map(([name,info])=>{
      const h=(history[name]||[]);const last=h.length?h[h.length-1].s:null;const lbl=last!==null?scoreLabel(name,last):null;
      return React.createElement('button',{key:name,onClick:()=>startTest(name),className:'card',style:{width:'100%',textAlign:'left',cursor:'pointer'}},
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          React.createElement('span',{style:{fontSize:18,color:'var(--accent)',fontFamily:'var(--font-d)'}},name),
          lbl&&React.createElement('span',{style:{fontSize:12,padding:'3px 10px',borderRadius:20,background:lbl.c+'22',color:lbl.c}},t(lbl.text))),
        React.createElement('div',{style:{fontSize:13,color:'var(--textM)',marginTop:6}},info.desc),
        h.length>=2&&React.createElement('div',{style:{marginTop:12}},React.createElement(TrendChart,{data:h,max:info.max,color:lbl.c})));}));
  if(result!==null){const lbl=scoreLabel(test,result);
    return React.createElement('div',{className:'page',style:{display:'flex',flexDirection:'column',alignItems:'center',gap:20,paddingTop:30}},
      React.createElement('div',{style:{fontSize:14,color:'var(--textD)',textTransform:'uppercase',letterSpacing:2}},test),
      React.createElement('div',{style:{fontSize:56,color:lbl.c,fontFamily:'var(--font-d)',fontWeight:600}},result),
      React.createElement('div',{style:{fontSize:16,color:lbl.c}},t(lbl.text)),
      React.createElement('div',{style:{width:'100%',maxWidth:300,height:6,background:'var(--surface)',borderRadius:3,overflow:'hidden'}},
        React.createElement('div',{style:{height:'100%',width:`${(result/TESTS[test].max)*100}%`,background:lbl.c,borderRadius:3}})),
      React.createElement('p',{style:{maxWidth:340,textAlign:'center',color:'var(--textM)',fontSize:13,lineHeight:1.7}},t('For self-monitoring only. Please speak with a professional if concerned.')),
      React.createElement('div',{style:{display:'flex',gap:12}},
        React.createElement('button',{onClick:()=>setTest(null),className:'primary-btn'},t('All Tests')),
        React.createElement('button',{onClick:onBack,className:'secondary-btn'},t('Home'))));}
  const info=TESTS[test];
  return React.createElement('div',{className:'page',style:{display:'flex',flexDirection:'column',gap:20,paddingTop:8}},
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between'}},
      React.createElement('button',{onClick:()=>setTest(null),className:'back-btn'},t('← Tests')),
      React.createElement('span',{style:{color:'var(--textD)',fontSize:13}},`${cur+1} / ${info.q.length}`)),
    React.createElement('div',{style:{width:'100%',height:3,background:'var(--surface)',borderRadius:2,overflow:'hidden'}},
      React.createElement('div',{style:{height:'100%',width:`${((cur+1)/info.q.length)*100}%`,background:'var(--accent)',transition:'width .3s'}})),
    React.createElement('div',{style:{fontSize:13,color:'var(--textM)'}},test==='PSS-10'?t('In the last month, how often have you…'):t('Over the last 2 weeks, how often have you been bothered by…')),
    React.createElement('div',{style:{fontSize:16,color:'var(--accent)',fontFamily:'var(--font-d)',lineHeight:1.5}},t(info.q[cur].replace(' (R)',''))),
    React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:10}},
      ...info.opts.map(o=>React.createElement('button',{key:o.v,onClick:()=>answer(o.v),style:{padding:'14px 18px',background:'var(--surface)',border:'1px solid var(--surfaceL)',borderRadius:12,color:'var(--text)',fontSize:15,cursor:'pointer',textAlign:'left'}},t(o.l))))
  );
}

// ═══════════════════════════════════════════════════════════════
function Brojanica({onBack}){
  const[currentBead,setCurrentBead]=useState(0);
  const[krugova,setKrugova]=useState(()=>store.get('brojanica_krugova')||0);
  const[sesijaKrugova,setSesijaKrugova]=useState(0);
  const[zvukOn,setZvukOn]=useState(true);
  const[showMolitva,setShowMolitva]=useState(true);
  const audioCtx=useRef(null);

  // Diskretan "klik" zvuk pri svakom čvoru
  const playClick=()=>{
    if(!zvukOn)return;
    try{
      if(!audioCtx.current)audioCtx.current=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=audioCtx.current;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.frequency.value=180;
      gain.gain.setValueAtTime(0.08,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start();osc.stop(ctx.currentTime+0.08);
    }catch(e){}
  };

  const sljedeci=()=>{
    playClick();
    const n=currentBead+1;
    if(n>=33){
      // Jedan krug završen
      setCurrentBead(0);
      setSesijaKrugova(sesijaKrugova+1);
      const noviUkupno=krugova+1;
      setKrugova(noviUkupno);
      store.set('brojanica_krugova',noviUkupno);
    }else{
      setCurrentBead(n);
    }
  };

  const resetSesija=()=>{setCurrentBead(0);setSesijaKrugova(0);};

  // SVG brojanica — 33 čvora u krug + krst
  const radius=120;
  const beadCount=33;
  const beads=[];
  for(let i=0;i<beadCount;i++){
    const angle=(i/beadCount)*2*Math.PI - Math.PI/2; // počinje od vrha
    const x=160+radius*Math.cos(angle);
    const y=160+radius*Math.sin(angle);
    const isActive=i===currentBead;
    const isPrayed=i<currentBead;
    beads.push(React.createElement('circle',{
      key:i,cx:x,cy:y,r:isActive?10:7,
      fill:isActive?'#C9A961':isPrayed?'#8B6F47':'#5A4A33',
      stroke:isActive?'#F2D98D':'#3D2E1F',strokeWidth:isActive?2:1,
      style:{transition:'all 0.3s ease',cursor:'pointer',filter:isActive?'drop-shadow(0 0 8px rgba(201,169,97,0.6))':'none'},
      onClick:sljedeci
    }));
  }

  return React.createElement('div',{className:'page',style:{display:'flex',flexDirection:'column',alignItems:'center',gap:16,paddingTop:8}},
    React.createElement('button',{onClick:onBack,className:'back-btn'},t('← Back')),
    React.createElement('h2',{className:'h2',style:{fontFamily:'var(--font-cyr)',fontSize:28,color:'#C9A961',fontWeight:500}},'Бројаница'),
    React.createElement('p',{style:{color:'var(--textM)',fontSize:13,textAlign:'center',maxWidth:320,lineHeight:1.6,fontStyle:'italic'}},'Исусова молитва. Тридесет три чвора — једно уздизање ума ка Христу.'),

    // Brojanica SVG — klikni na centar ili bilo koji čvor
    React.createElement('div',{style:{position:'relative',width:'100%',maxWidth:320,aspectRatio:'320/360',display:'flex',alignItems:'center',justifyContent:'center'}},
      React.createElement('svg',{viewBox:'0 0 320 360',style:{position:'absolute',top:0,left:0,width:'100%',height:'100%'}},
        // Spojne linije između čvorova (tanka smeđa linija)
        React.createElement('circle',{cx:160,cy:160,r:radius,fill:'none',stroke:'rgba(139,111,71,0.25)',strokeWidth:1,strokeDasharray:'2 4'}),
        // Čvorovi
        ...beads,
        // Krst na vrhu (iznad brojanice)
        React.createElement('line',{x1:160,y1:281,x2:160,y2:300,stroke:'#8B6F47',strokeWidth:1.5}),
        React.createElement('g',{transform:'translate(160, 326)'},
          React.createElement('rect',{x:-3,y:-26,width:6,height:52,fill:'#C9A961',stroke:'#8B6F47',strokeWidth:1,rx:1}),
          React.createElement('rect',{x:-8,y:-23,width:16,height:4,fill:'#C9A961',stroke:'#8B6F47',strokeWidth:1,rx:1}),
          React.createElement('rect',{x:-16,y:-12,width:32,height:6,fill:'#C9A961',stroke:'#8B6F47',strokeWidth:1,rx:1}),
          // Donja prečka pravoslavnog krsta (nakošena)
          React.createElement('rect',{x:-11,y:4,width:22,height:4,fill:'#C9A961',stroke:'#8B6F47',strokeWidth:1,rx:1,transform:'rotate(18)'})
        )
      ),

      // Centralni krug — klikni za sljedeći čvor (responzivan)
      React.createElement('button',{
        onClick:sljedeci,
        style:{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,calc(-50% - 20px))',width:'43%',aspectRatio:'1/1',borderRadius:'50%',border:'1.5px solid rgba(201,169,97,0.4)',background:'linear-gradient(135deg, rgba(201,169,97,0.08), rgba(139,111,71,0.05))',color:'var(--text)',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,backdropFilter:'blur(8px)',WebkitBackdropFilter:'blur(8px)'}

        React.createElement('div',{style:{fontSize:11,color:'var(--textD)',letterSpacing:1}},'/ 33'),
        React.createElement('div',{style:{fontSize:10,color:'var(--textD)',marginTop:6,fontStyle:'italic'}},'додирни')
      )
    ),

    // Molitva na ćirilici
    showMolitva&&React.createElement('div',{style:{textAlign:'center',padding:'16px 20px',background:'rgba(201,169,97,0.06)',border:'1px solid rgba(201,169,97,0.2)',borderRadius:16,maxWidth:360}},
      React.createElement('div',{style:{fontSize:17,fontFamily:'var(--font-d)',color:'#C9A961',fontWeight:400,lineHeight:1.5}},'Господе Исусе Христе,'),

      React.createElement('div',{style:{textAlign:'center'}},
        React.createElement('div',{style:{fontSize:22,fontFamily:'var(--font-d)',color:'var(--text)'}},krugova),
        React.createElement('div',{style:{fontSize:10,letterSpacing:1,color:'var(--textD)',marginTop:2}},'УКУПНО')
      )
    ),

    // Kontrole
    React.createElement('div',{style:{display:'flex',gap:8,marginTop:4,flexWrap:'wrap',justifyContent:'center'}},
      React.createElement('button',{onClick:()=>setZvukOn(!zvukOn),className:'pill',style:{background:zvukOn?'rgba(201,169,97,0.15)':'var(--surface)',color:zvukOn?'#C9A961':'var(--textD)',padding:'6px 14px',fontSize:12}},zvukOn?'🔊 Звук':'🔇 Нема звука'),
      React.createElement('button',{onClick:()=>setShowMolitva(!showMolitva),className:'pill',style:{background:showMolitva?'rgba(201,169,97,0.15)':'var(--surface)',color:showMolitva?'#C9A961':'var(--textD)',padding:'6px 14px',fontSize:12}},showMolitva?'Сакриј молитву':'Прикажи молитву'),

// SOUNDSCAPE ENGINE (Web Audio API — zero files, pure synthesis)
// ═══════════════════════════════════════════════════════════════
const AudioEngine = {
  ctx: null,
  master: null,
  nodes: {},
  
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
  },
  
  resume() { if (this.ctx?.state === 'suspended') this.ctx.resume(); },
  
  setMaster(v) { if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3); },
  
  // ── Rain: filtered white noise with gentle modulation ──
  startRain(vol = 0.5) {
    this.init(); this.stopSound('rain');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 0.7;
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 200;
    const gain = this.ctx.createGain(); gain.gain.value = vol;
    // Gentle rain modulation
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.15; lfoGain.gain.value = 200;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();
    src.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.rain = { src, gain, lfo, lp, hp, lfoGain };
  },
  
  // ── Ocean: layered filtered noise with slow wave rhythm ──
  startOcean(vol = 0.4) {
    this.init(); this.stopSound('ocean');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.3;
    const gain = this.ctx.createGain(); gain.gain.value = 0;
    // Wave rhythm: slow volume swell
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.08; lfoGain.gain.value = vol * 0.5;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    gain.gain.setValueAtTime(vol * 0.5, this.ctx.currentTime);
    // Frequency sweep for wave character
    const lfo2 = this.ctx.createOscillator();
    const lfo2Gain = this.ctx.createGain();
    lfo2.frequency.value = 0.06; lfo2Gain.gain.value = 250;
    lfo2.connect(lfo2Gain); lfo2Gain.connect(bp.frequency);
    lfo.start(); lfo2.start();
    src.connect(bp); bp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.ocean = { src, gain, lfo, lfo2, bp, lfoGain, lfo2Gain };
  },
  
  // ── Wind: very low filtered noise ──
  startWind(vol = 0.3) {
    this.init(); this.stopSound('wind');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 300;
    const gain = this.ctx.createGain(); gain.gain.value = vol;
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.05; lfoGain.gain.value = 150;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();
    src.connect(lp); lp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.wind = { src, gain, lfo, lp, lfoGain };
  },
  
  // ── Ambient Drone: layered sine/triangle oscillators with detune ──
  startDrone(vol = 0.25) {
    this.init(); this.stopSound('drone');
    const freqs = [55, 82.5, 110, 165]; // A1, E2, A2, E3 — open fifth harmony
    const oscs = freqs.map((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = (Math.random() - 0.5) * 8; // subtle detuning
      return osc;
    });
    const gain = this.ctx.createGain(); gain.gain.value = 0;
    gain.gain.setTargetAtTime(vol / freqs.length, this.ctx.currentTime, 2);
    // Gentle shimmer
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.03; lfoGain.gain.value = vol * 0.15;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    lfo.start();
    oscs.forEach(o => { o.connect(gain); o.start(); });
    gain.connect(this.master);
    this.nodes.drone = { oscs, gain, lfo, lfoGain };
  },
  
  // ── Binaural Beats: two sine waves with frequency offset ──
  startBinaural(vol = 0.2, type = 'theta') {
    this.init(); this.stopSound('binaural');
    const baseFreqs = { delta: { f: 150, beat: 2 }, theta: { f: 200, beat: 5 }, alpha: { f: 220, beat: 10 } };
    const { f, beat } = baseFreqs[type] || baseFreqs.theta;
    const oscL = this.ctx.createOscillator(); oscL.frequency.value = f;
    const oscR = this.ctx.createOscillator(); oscR.frequency.value = f + beat;
    const merger = this.ctx.createChannelMerger(2);
    const gainL = this.ctx.createGain(); gainL.gain.value = vol;
    const gainR = this.ctx.createGain(); gainR.gain.value = vol;
    oscL.connect(gainL); gainL.connect(merger, 0, 0);
    oscR.connect(gainR); gainR.connect(merger, 0, 1);
    merger.connect(this.master);
    oscL.start(); oscR.start();
    this.nodes.binaural = { oscL, oscR, gainL, gainR, merger, type };
  },
  
  // ── Singing Bowl: decaying sine with harmonics ──
  playBowl() {
    this.init();
    const freqs = [261.6, 523.3, 784.9]; // C overtone series
    freqs.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = f;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.15 / (i + 1), this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 6 + i * 2);
      osc.connect(gain); gain.connect(this.master);
      osc.start(); osc.stop(this.ctx.currentTime + 8 + i * 2);
    });
  },
  
  setVolume(name, vol) {
    const n = this.nodes[name];
    if (n?.gain) n.gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.3);
    if (n?.gainL) { n.gainL.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.3); n.gainR.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.3); }
  },
  
  stopSound(name) {
    const n = this.nodes[name];
    if (!n) return;
    try {
      if (n.gain) n.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
      setTimeout(() => {
        try {
          if (n.src) n.src.stop();
          if (n.oscs) n.oscs.forEach(o => o.stop());
          if (n.oscL) { n.oscL.stop(); n.oscR.stop(); }
          if (n.lfo) n.lfo.stop();
          if (n.lfo2) n.lfo2.stop();
        } catch {}
        delete this.nodes[name];
      }, 800);
    } catch { delete this.nodes[name]; }
  },
  
  stopAll() { Object.keys(this.nodes).forEach(k => this.stopSound(k)); },
  
  isPlaying(name) { return !!this.nodes[name]; }
};
