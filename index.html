<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--font-d:'Fraunces','Noto Serif',Georgia,serif;--font-b:'Nunito','Noto Serif',sans-serif;--font-cyr:'Noto Serif',Georgia,serif;}
/* Ćirilica — koristi Noto Serif za lijep render pravoslavnog teksta */
@font-face{font-family:'CyrDisplay';src:local('Noto Serif'),local('Georgia');unicode-range:U+0400-04FF,U+0500-052F,U+2DE0-2DFF,U+A640-A69F;}
body[data-theme="light"]{
--bg:#F5F0E4;--bgGrad:linear-gradient(180deg,#F5F0E4 0%,#EBEEDF 50%,#E0EAD8 100%);
--bgCard:rgba(255,255,255,.55);--surface:rgba(255,255,255,.5);--surfaceL:rgba(181,207,160,.25);--bgHover:rgba(255,255,255,.75);
--text:#3D5938;--textM:#5D7656;--textD:#7A8B73;
--accent:#7BA577;--accentD:#5C8B5A;--warm:#E8C796;--warmD:#D4A569;
--danger:#D4736A;--good:#7BA577;--mid:#E8C796;
--cardBorder:rgba(181,207,160,.25);--cardShadow:0 4px 16px rgba(107,135,101,.08);
--scrollThumb:rgba(122,139,115,.3);
}
body[data-theme="dark"]{
--bg:#1B2924;--bgGrad:linear-gradient(180deg,#1B2924 0%,#1F2E26 50%,#243329 100%);
--bgCard:rgba(255,255,255,.05);--surface:rgba(255,255,255,.05);--surfaceL:rgba(181,207,160,.12);--bgHover:rgba(255,255,255,.08);
--text:#E8EDD9;--textM:#BDD0AC;--textD:#9DB591;
--accent:#95C088;--accentD:#B5CFA0;--warm:#F5D88B;--warmD:#E8C796;
--danger:#E89B92;--good:#A8D199;--mid:#F5D88B;
--cardBorder:rgba(181,207,160,.15);--cardShadow:none;
--scrollThumb:rgba(157,181,145,.3);
}
html,body,#root{height:100%;color:var(--text);font-family:var(--font-b);transition:color .4s ease}
body{background:var(--bgGrad);background-attachment:fixed;overscroll-behavior:none;transition:background .4s ease}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--scrollThumb);border-radius:2px}
input,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--textD)}
textarea{resize:vertical}
input[type=range]{height:4px;-webkit-appearance:none;appearance:none;background:var(--surfaceL);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}

/* Install banner */
.install-banner{position:fixed;bottom:20px;left:20px;right:20px;padding:16px 20px;background:var(--bgCard);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--cardBorder);border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:100;animation:slideUp .4s ease;box-shadow:var(--cardShadow)}
.install-banner button{padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.install-btn{background:var(--accent);color:#fff}
.dismiss-btn{background:transparent;color:var(--textM)}
@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Page container */
.page{max-width:440px;margin:0 auto;padding:env(safe-area-inset-top,20px) 20px 40px;min-height:100vh;position:relative;z-index:1}

/* Shared */
.back-btn{background:none;border:none;color:var(--textM);font-size:14px;cursor:pointer;padding:4px 0;font-family:inherit}
.primary-btn{padding:14px 32px;border-radius:28px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;box-shadow:0 2px 8px rgba(123,165,119,.25)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(123,165,119,.35)}
.primary-btn:active{transform:translateY(0);opacity:.85}
.secondary-btn{padding:14px 32px;border-radius:28px;border:1px solid var(--cardBorder);background:var(--bgCard);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill{padding:6px 14px;border-radius:20px;border:none;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.card{padding:16px 20px;background:var(--bgCard);border-radius:18px;border:1px solid var(--cardBorder);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--cardShadow);transition:all .3s}
.section-label{font-size:11px;color:var(--textD);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600}
.h2{margin:0;color:var(--text);font-family:var(--font-d);font-weight:400;font-size:28px;text-align:center;letter-spacing:0.3px}

/* Dot animation */
.dots{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* Breathe circle */
/* Breath orb — multi-layered animated breathing visual */
.breath-orb-wrap{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.breath-orb-glow{position:absolute;inset:-20px;border-radius:50%;filter:blur(24px);opacity:.55;transition:all 1s cubic-bezier(.4,0,.2,1)}
.breath-orb-glow.slow{transition-duration:6s}
.breath-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid;opacity:.4;animation:orb-rotate 18s linear infinite}
.breath-orb-ring-2{position:absolute;inset:14px;border-radius:50%;border:1px solid;opacity:.3;animation:orb-rotate 24s linear infinite reverse}
.breath-orb-core{position:relative;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s cubic-bezier(.4,0,.2,1);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.15) 0%,transparent 60%)}
.breath-orb-core.slow{transition-duration:6s}
.breath-orb-core.idle{transition-duration:.4s}
@keyframes orb-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orb-pulse{0%,100%{opacity:.4}50%{opacity:.7}}
.breath-orb-particles{position:absolute;inset:0;border-radius:50%;pointer-events:none;overflow:hidden}
.breath-particle{position:absolute;border-radius:50%;background:currentColor;opacity:0;animation:particle-drift 3s ease-out infinite}
@keyframes particle-drift{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.6}100%{transform:translate(var(--dx,0),var(--dy,0)) scale(1.2);opacity:0}}

/* Respect motion preferences — disable decorative animations */
@media (prefers-reduced-motion: reduce){
  .breath-orb-ring,.breath-orb-ring-2,.anim-moon,.anim-sun,.anim-tree-1,.anim-tree-2,.anim-tree-3,.anim-cloud,.anim-cloud-2,.anim-star,.anim-star-2,.anim-star-3{animation:none !important}
  .breath-orb-glow,.breath-orb-core{transition-duration:.4s !important}
}

/* CBT progress orb — circular SVG with gentle fill animation */
.progress-orb-wrap{display:flex;align-items:center;gap:12px}
.progress-orb-svg{width:36px;height:36px;flex-shrink:0}
.progress-orb-track{fill:none;stroke:var(--surfaceL);stroke-width:3}
.progress-orb-fill{fill:none;stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
.progress-orb-pulse{animation:progress-pulse 2.4s ease-in-out infinite}
@keyframes progress-pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){
  .progress-orb-pulse{animation:none}
}

/* Body Scan silhouette */
.body-silhouette{position:relative;width:80px;height:200px;flex-shrink:0;margin:0 auto}
.body-silhouette svg{width:100%;height:100%;overflow:visible}
.body-region{transition:fill .8s ease,filter .8s ease,opacity .8s ease;fill:var(--surfaceL);opacity:.5}
.body-region.active{fill:var(--accent);opacity:.85;filter:drop-shadow(0 0 10px var(--accent))}
.body-region.glow{animation:body-pulse 3s ease-in-out infinite}
@keyframes body-pulse{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 16px var(--accent))}}
@media (prefers-reduced-motion: reduce){
  .body-region{transition-duration:.3s}
  .body-region.glow{animation:none}
}

/* Soundscape visualizers */
.sound-viz{position:relative;height:60px;border-radius:12px;overflow:hidden;margin-top:10px;background:var(--surface);border:1px solid var(--surfaceL)}
.sound-viz svg{width:100%;height:100%;display:block}
@keyframes rain-fall{0%{transform:translateY(-10px);opacity:0}20%{opacity:.7}100%{transform:translateY(80px);opacity:0}}
.rain-drop{animation:rain-fall 1.4s linear infinite}
@keyframes wave-roll{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
.wave-line{animation:wave-roll 4s ease-in-out infinite}
@keyframes wind-drift{0%{transform:translateX(-30px);opacity:0}30%{opacity:.6}100%{transform:translateX(360px);opacity:0}}
.wind-wisp{animation:wind-drift 6s ease-in-out infinite}
@keyframes drone-pulse{0%,100%{r:10;opacity:.5}50%{r:18;opacity:.3}}
.drone-pulse{animation:drone-pulse 4s ease-in-out infinite}
@keyframes binaural-l{0%,100%{r:6;opacity:.7}50%{r:9;opacity:1}}
@keyframes binaural-r{0%,100%{r:6;opacity:.7}45%{r:9;opacity:1}}
.binaural-l{animation:binaural-l 1.8s ease-in-out infinite}
.binaural-r{animation:binaural-r 1.85s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .rain-drop,.wave-line,.wind-wisp,.drone-pulse,.binaural-l,.binaural-r{animation:none !important}
}

/* Micro-moments — small celebrations and breaths of life */
/* Logo subtle wink/bounce every ~30s */
@keyframes logo-blink{0%,93%,100%{transform:scale(1)}96%{transform:scale(.96) translateY(2px)}}
.logo-alive{animation:logo-blink 32s ease-in-out infinite}
/* Step completion glow flash */
@keyframes complete-glow{0%{box-shadow:0 0 0 0 rgba(123,165,119,0)}50%{box-shadow:0 0 30px 8px rgba(123,165,119,.4)}100%{box-shadow:0 0 0 0 rgba(123,165,119,0)}}
.complete-glow{animation:complete-glow 1.4s ease-out}
/* Soft confetti for streak milestones */
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(120px) rotate(540deg);opacity:0}}
.confetti-piece{position:absolute;width:6px;height:6px;border-radius:1px;animation:confetti-fall 2.5s ease-out forwards;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .logo-alive,.complete-glow{animation:none !important}
}

/* Geronda hero portrait — soft fade into the page, gentle breathing */
.geronda-hero{position:relative;height:290px;line-height:0;-webkit-mask-image:linear-gradient(180deg,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,#000 74%,transparent 100%);animation:hero-breathe 9s ease-in-out infinite;transform-origin:50% 100%}
.geronda-hero .g-base{height:100%;width:auto;display:block}
.g-ov{position:absolute;opacity:0;pointer-events:none;max-width:none;display:block}
/* трептај — сваких ~6 s, око 170 ms */
.g-b1{animation:g-b1 5.8s linear infinite}
.g-b2{animation:g-b2 5.8s linear infinite}
@keyframes g-b1{0%,94%{opacity:0}94.5%{opacity:1}95.1%{opacity:0}96.3%{opacity:1}97%,100%{opacity:0}}
@keyframes g-b2{0%,94.7%{opacity:0}95.1%,96%{opacity:1}96.4%,100%{opacity:0}}
/* благи осмијех — сваких 15 s, траје ~4 s */
.g-s1{animation:g-s1 15s ease-in-out infinite}
.g-s2{animation:g-s2 15s ease-in-out infinite}
.g-s3{animation:g-s3 15s ease-in-out infinite}
@keyframes g-s1{0%,30%{opacity:0}33%,67%{opacity:1}70%,100%{opacity:0}}
@keyframes g-s2{0%,33%{opacity:0}36%,64%{opacity:1}67%,100%{opacity:0}}
@keyframes g-s3{0%,36%{opacity:0}39%,61%{opacity:1}64%,100%{opacity:0}}
/* поздрав на додир — 3 s: наклон напријед, осмијех, трептај у дну наклона */
.geronda-hero{cursor:pointer;outline:none;-webkit-user-select:none;user-select:none}
.geronda-hero.tap{animation:g-bow 3s cubic-bezier(.45,.05,.35,1) both}
@keyframes g-bow{0%{transform:perspective(700px) rotateX(0) translateY(0)}32%,52%{transform:perspective(700px) rotateX(-13deg) translateY(5px) scale(.99)}100%{transform:perspective(700px) rotateX(0) translateY(0)}}
.geronda-hero.tap .g-s1{animation:g-ts1 3s ease-in-out both}
.geronda-hero.tap .g-s2{animation:g-ts2 3s ease-in-out both}
.geronda-hero.tap .g-s3{animation:g-ts3 3s ease-in-out both}
@keyframes g-ts1{0%,4%{opacity:0}12%,82%{opacity:1}92%,100%{opacity:0}}
@keyframes g-ts2{0%,10%{opacity:0}18%,76%{opacity:1}86%,100%{opacity:0}}
@keyframes g-ts3{0%,16%{opacity:0}25%,70%{opacity:1}80%,100%{opacity:0}}
.geronda-hero.tap .g-b1{animation:g-tb1 3s linear both}
.geronda-hero.tap .g-b2{animation:g-tb2 3s linear both}
@keyframes g-tb1{0%,36%{opacity:0}37%{opacity:1}38%{opacity:0}40.3%{opacity:1}41.5%,100%{opacity:0}}
@keyframes g-tb2{0%,37.4%{opacity:0}38.2%,39.8%{opacity:1}40.6%,100%{opacity:0}}
@keyframes hero-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@media (prefers-reduced-motion: reduce){.geronda-hero,.geronda-hero.tap,.g-ov{animation:none}.geronda-hero.tap .g-s3{animation:g-ts3 3s ease-in-out both}}
/* Old breathe-circle kept for backwards compat but unused */
.breathe-circle{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s cubic-bezier(.4,0,.2,1)}
.breathe-circle.slow{transition-duration:6s}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-card{padding:16px 10px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:18px;cursor:pointer;text-align:center;transition:all .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--cardShadow)}
.action-card:hover{transform:translateY(-2px);background:var(--bgHover)}
.action-card:active{transform:translateY(0);background:var(--bgHover)}

/* Top bar */
.about-btn{display:inline-flex;align-items:center;gap:6px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:14px;padding:5px 11px 5px 6px;font-size:11px;font-weight:600;color:var(--accentD);cursor:pointer;font-family:var(--font-cyr);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap}
.about-btn.active{background:var(--accent);color:#fff}
.about-i{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-style:italic;font-family:Georgia,serif}
.about-btn.active .about-i{background:#fff;color:var(--accent)}
@media(max-width:350px){.about-btn{font-size:0;padding:5px}.about-btn .about-i{font-size:11px}}
.ikona-wrap{display:flex;flex-direction:column;align-items:center;gap:0}
.ikona-krst{font-size:18px;color:#C9A961;line-height:1;margin-bottom:4px;text-shadow:0 0 10px rgba(201,169,97,.5)}
.ikona-okvir{position:relative;padding:9px;border-radius:50% 50% 10px 10px/15% 15% 10px 10px;background:linear-gradient(145deg,#7a5a22 0%,#e9d08c 18%,#b8954f 38%,#f4e3ad 55%,#a8823d 75%,#e0c27a 90%,#6e5020 100%);box-shadow:0 10px 30px rgba(90,62,20,.28),0 0 0 1px rgba(110,80,32,.55),inset 0 1px 0 rgba(255,250,230,.6);max-width:72vw}
.ikona-okvir::after{content:'';position:absolute;inset:4px;border-radius:inherit;border:1px solid rgba(255,244,210,.55);pointer-events:none}
.ikona-unutra{border-radius:50% 50% 5px 5px/14% 14% 5px 5px;overflow:hidden;padding:3px;background:#3b2a12;box-shadow:inset 0 0 0 1px rgba(233,208,140,.5)}
.ikona-unutra img{display:block;width:100%;height:auto;border-radius:50% 50% 3px 3px/13.5% 13.5% 3px 3px}
.kandilo{width:18px;height:22px;margin-top:10px;position:relative;border-radius:3px 3px 9px 9px;background:linear-gradient(180deg,#9b1c1c,#5e0f0f);box-shadow:0 0 0 1px rgba(201,169,97,.7)}
.kandilo .plamen{position:absolute;left:50%;top:-9px;width:8px;height:13px;margin-left:-4px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff6c8 0%,#ffd36b 45%,#ff9a2e 80%,transparent 100%);box-shadow:0 0 14px 5px rgba(255,190,90,.45);animation:plamen 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes plamen{0%,100%{transform:scale(1) rotate(-1deg);opacity:.95}35%{transform:scale(1.06,1.12) rotate(2deg);opacity:1}70%{transform:scale(.96,1.02) rotate(-2deg);opacity:.88}}
.ikona-natpis{margin-top:12px;text-align:center;font-family:var(--font-cyr);font-size:14px;color:#B8954F;letter-spacing:.4px;display:flex;flex-direction:column;gap:2px}
.ikona-natpis span{font-size:11px;color:var(--textD);letter-spacing:.3px;font-style:italic}
body[data-theme="dark"] .ikona-okvir{box-shadow:0 10px 34px rgba(0,0,0,.45),0 0 40px rgba(201,169,97,.12),0 0 0 1px rgba(110,80,32,.55)}
@media (prefers-reduced-motion: reduce){.kandilo .plamen{animation:none}}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;max-width:440px;margin:0 auto;position:relative;z-index:10}
.brand-top{font-size:10px;color:var(--accentD);font-weight:600;letter-spacing:1.5px}
.toggle-group{display:flex;gap:8px;align-items:center}
.lang-toggle,.theme-toggle{display:flex;gap:2px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:14px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang-btn,.theme-btn{padding:4px 10px;border-radius:11px;border:none;font-size:11px;font-weight:600;cursor:pointer;transition:all .25s;background:transparent;color:var(--textD);font-family:inherit}
.lang-btn.active{background:var(--accent);color:#fff}
.theme-btn{padding:4px 8px;font-size:13px;line-height:1}
.theme-btn.active{background:var(--accent);color:#fff}

/* Animated scenes */
.scene-bg{position:fixed;top:0;left:0;right:0;height:200px;pointer-events:none;z-index:0;overflow:hidden;opacity:.85;mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%)}
.scene-bg svg{width:100%;height:100%;display:block}
@keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes drift{0%{transform:translateX(-30px)}100%{transform:translateX(440px)}}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-moon{animation:float-y 6s ease-in-out infinite;transform-origin:center}
.anim-sun{animation:float-y 7s ease-in-out infinite;transform-origin:center}
.anim-tree-1{animation:sway 5.5s ease-in-out infinite;transform-origin:bottom center}
.anim-tree-2{animation:sway 6.5s ease-in-out infinite -2s;transform-origin:bottom center}
.anim-tree-3{animation:sway 5s ease-in-out infinite -3.5s;transform-origin:bottom center}
.anim-cloud{animation:drift 60s linear infinite}
.anim-cloud-2{animation:drift 75s linear infinite -25s}

     "Паника досеже врхунац у максимално 10 минута. Ваше тијело је не може дуже одржати — остане без адреналина. Можете надживјети сваки вал.",
     "Кад олуја прође (а увијек прође), захвалите себи. Управо сте доказали да можете преживјети панику без контролисања. То мијења све."]

  social:[
    ["Примијетите мисао управо сада: 'Сви ме гледају. Осуђиват ће шта носим, како изгледам, шта говорим.'",
     "Научни налаз: студије (Гилович, 2000) показују да људи памте око 50% МАЊЕ о нама него што ми мислимо. Ми смо статисти у њиховом филму, не главни лик.",
     "Покушајте ово: сјетите се три особе које сте видјели јуче. Шта су носили? Шта су рекли? Вјероватно се не сјећате детаља — и они се не сјећају ваших.",
     "Сада изаберите једну особу у близини. Током 30 секунди проучавајте њено лице, држање, на шта је фокусирана. Примијетите — утопљена је у свој свијет, не у ваш.",
     "Поновите тихо: 'Нисам у центру пажње. Ово је слобода, не одбацивање.'",
     "Рефлектор није на вама. Никада није ни био. Можете се кретати кроз овај простор тачно онакви какви јесте."],
    ["Имате 90 секунди прије него уђете. Нађите тих кутак — купатило, ходник, паркирано ауто. Сједите или стојте мирно.",
     "Удахните кроз нос 4 секунде. Осјетите како се груди и трбух дижу.",
     "Задржите благо 4 секунде. Без напора.",
     "Издахните кроз уста 6 секунди — дуго, полако, равномјерно. Можете правити тих 'шшшш' звук ако вам помаже.",
     "Поновите овај циклус 6 пута (око 90 секунди укупно). Дуги издах активира парасимпатички нервни систем — ваше тијело прелази из 'пријетње' у 'сигурност'.",
     "Устаните. Откотрљајте рамена уназад. Један мали осмијех себи — управо сте дали нервном систему предност. Уђите."],
    ["Примијетите да то радите. 'Поново прерађујем ону интеракцију.' Само то именујте. Не осуђујте себе због размишљања — то додаје други слој.",
     "Питајте се: 'Скупљам ли корисне информације, или само себе мучим?' Будите искрени. Размишљање овог типа дјелује продуктивно али ријетко јесте.",
     "Поставите тајмер на 5 минута. Дајте себи дозволу да интензивно размишљате о томе тих 5 минута — запишите шта бисте урадили другачије.",
     "Кад тајмер истекне — затворите га. Наглас или у глави: 'Завршио сам са размишљањем које ово заслужује.'",
     "Устаните. Покрените тијело. Идите у другу собу. Полијте лице водом. Помак тијела сигнализира помак ума.",
     "Ако се мисао врати: 'Већ сам јој данас дао вријеме. Репродукција је готова.' Онда урадите нешто рукама — судове, шетњу, било шта."],
    ["Именујте страх конкретно. Не 'људи ће ме осуђивати' него 'ако наручим кафу својим нормалним гласом, баристи ће мислити да сам чудан.'",
     "Предвидите исход. Колики је % шансе да се деси? Шта би тачно урадили? Запишите: '70% шансе да баристи направи гримасу.'",
     "Дизајнирајте мали експеримент да то тестирате. Сутра наручите кафу нормално. Примијетите реакцију баристе. То је све.",
     "Покрените експеримент. Немојте 'контролисати' исход — само посматрајте шта се дешава као научник.",
     "Упоредите предвиђање са стварношћу. Да ли је баристи направио гримасу? У 95% случајева страх се не оствари — а и кад се деси, много је мањи од замишљеног.",
     "Ажурирајте своје увјерење. Не 'људи ме не осуђују' (преапсолутно) него 'прецијенио сам пријетњу. Свијет је углавном равнодушан, на добар начин.'"],
    ["Слушајте шта је ваш унутрашњи глас управо рекао. Можда: 'Звучао си тако глупо. Зашто си то рекао? Сви су примијетили.'",
     "Замислите да вам је блиски пријатељ рекао да има исту ту мисао. Шта бисте му рекли?",
     "Вјероватно му не бисте рекли 'да, ЈЕСИ глуп.' Вјероватно бисте рекли: 'Није било тако лоше. Људи нису пажљиво гледали. И ја то стално радим.'",
     "Сада окрените тај глас према себи. Реците тихо или наглас: [шта год бисте рекли пријатељу]",
     "Примијетите отпор. Нормално је осјећати 'али заслужујем оштрину.' Тај глас је негдје научен — није истина.",
     "Поновите једну реченицу: 'Говорићу себи онако како бих говорио некоме кога волим.' Ово није слабост. Ово је темељ отпорности."],
    ["Идентификујте циљ који дјелује немогуће. 'Стећи нове пријатеље.' 'Причати на састанцима.' 'Ићи на друштвене догађаје сам.'",
     "Сад га разбијте на 5 степена од најлакшег до најтежег. Примјер за 'Причати на састанцима': Степен 1 рећи добро јутро, Степен 2 поставити питање, Степен 3 подијелити мишљење, Степен 4 пристојно се не сложити, Степен 5 водити дискусију.",
     "Изаберите Степен 1. Радите САМО Степен 1 ове седмице. Немојте прескакати. Немојте покушавати 'бити храбрији.'",
     "Сваки пут кад завршите степен, оцијените стварну тежину (1-10) НАКОН, и забиљежите шта се десило.",
     "Након 5–7 успјешних понављања једног степена, пређите на сљедећи. Страх природно блиједи кроз понављање, не кроз вољу.",
     "Пењање ових љестава траје седмицама или мјесецима. То није споро — тако се мозак преусмјерава. Вјерујте процесу."],
    ["Данашња микро-вјежба. Изаберите ЈЕДНО од ових (само једно): направите контакт очима са касиром и реците хвала, држите контакт очима 1 секунду дуже при поздрављању, подијелите једно кратко мишљење у малој групи, или питајте странца неко мало питање.",
     "Акција траје мање од 30 секунди. Ишчекивање може трајати 30 минута — то је нормално. Примијетите јаз.",
     "Урадите то. Немојте чекати да се осјећате спремно. Акција прва, самопоуздање касније.",
     "Након: посматрајте како сте се заиста осјећали током, не како сте предвидјели. Обично мање страшно.",
     "Примијетите ако ваш унутрашњи глас покуша рећи 'то је било мало, не рачуна се.' РАЧУНА СЕ. Свако понављање је важно.",
     "Сутра: изаберите једну другачију микро-акцију. Циљ није осјећати се угодно — циљ је дјеловати упркос нелагоди. Удобност слиједи акцију, не обрнуто."],
    ["Запишите 3 реченице које можете рећи себи прије догађаја. Не лажи, не афирмације — истините ствари.",
     "Реченица 1 — о ситуацији: 'Већина социјалних интеракција прође у реду. Већ сам ово радио/ла.' Или: 'Чак и ако прође лоше, преживјет ћу.'",
     "Реченица 2 — о себи: 'Смијем бити тих/а. Смијем отићи. Смијем бити неугодно и бити у реду.'",
     "Реченица 3 — о другима: 'Већина људи је љубазна, анксиозна око себе, или равнодушна. Мало њих ме критички гледа.'",
     "Прочитајте све три наглас или у глави 3 пута. Прочитајте их поново непосредно прије уласка. Ваш мозак треба сценариј.",
     "Након догађаја, вратите се овој картици. Да ли су се најгори сценарији остварили? Ажурирајте реченице на основу стварних доказа, не анксиозне маште."]
  ],
  stress:[
    ["Затворите очи. Замислите спремник — било шта. Дрвену кутију. Сеф. Собу. Није важно шта, али направите га конкретним.",
     "Сад помислите на све што вас притиска управо сада. Набројте тихо или наглас. Посао. Породица. Онај имејл. Ствар коју сте заборавили.",
     "Једну по једну, њежно поставите сваку ствар у спремник. Не бацате — постављате, са поштовањем према свакој.",
     "Кад све буде унутра, затворите спремник. Закључајте га ако требате. Ствари су сигурне — нису нестале, само су похрањене.",
     "Поставите вријеме кад ћете поново отворити спремник. 'Сутра у 9 ујутро ћу се бавити овим.' Ово је обећање себи, не бијег.",
     "Управо сада, ваш ум смије да се одмори. Посао није изгубљен — похрањен је. До тада, ви сте слободни."],
    ["Стрес који не одлази кроз размишљање живи у тијелу. Пустит ћемо га кроз тијело.",
     "Устаните. Стегните СВЕ мишиће одједном — песнице, рамена, вилицу, ноге. Држите 5 секунди. Стегните још јаче.",
     "Сад отпустите. Пустите све. Спустите рамена. Отворите руке. Осјетите контраст.",
     "Сад се тресите. Само тресите руке, рамена, ноге, цијело тијело 30 секунди. Животиње то раде након пријетње — то ослобађа похрањени стрес.",
     "Дубоко удахните 3 пута. Примијетите — тијело се осјећа другачије. Можда трнци, топло, или само празније.",
     "Стрес је енергија. Енергија мора да се креће. Управо сте јој дали излаз. Ум ће слиједити."],
    ["Узмите папир. Нацртајте два ступца: ДАЈЕ енергију и ОДУЗИМА енергију.",
     "Помислите на протеклу седмицу. Набројте све што сте радили, у оба ступца. Будите конкретни. Не 'људи' — 'састанак са М.'",
     "Погледајте ступац ДАЈЕ. Шта је ту? Прочитајте сваку ставку. Ово су ваши извори обнављања. Нису опционални.",
     "Погледајте ступац ОДУЗИМА. Заокружите оне које дјелују неизбјежно. Означите звјездицом оне над којима имате контролу.",
     "Изаберите ЈЕДНУ ставку из које црпите енергију над којом имате контролу. Шта је најмања промјена коју можете направити? Прескочити је једном. Смањити за 20%. Премјестити за мање исцрпљен дан.",
     "Сагоријевање није о томе да превише радите. Ради се о давању више енергије него што примате. Преглед показује неравнотежу. Поправите једну ствар ове седмице."],
    ["ТИПП је DBT вјештина за кризу — користи се кад су емоције превише интензивне за размишљање. Четири дијела, кориштена заједно.",
     "Т — Температура. Држите нешто хладно на лицу — ледена вода, смрзнуто поврће, хладна крпа. 30 секунди. Ово активира рефлекс роњења и смирује срце.",
     "И — Интензивна вјежба. Трчите у мјесту. Урадите 20 скокова у мјесту раширених руку и ногу. Брзо се попните степеницама. 60 секунди. Сагоријева хемикалије стреса.",
     "П — Полако дисање. Удахните 4, издахните 8. Дужи издах је кључ. Минимум 5 циклуса.",
     "П — Парна мишићна релаксација. Стегните песнице 5 секунди. Отпустите. Стегните рамена 5 секунди. Отпустите. Прођите кроз цијело тијело.",
     "ТИПП не поправља узрок стреса. Купује вам вријеме — 20 минута јаснијег размишљања да паметно донесете сљедећу одлуку."],
    ["Сједите усправно. Затворите очи. Дишите нормално 30 секунди.",
     "Замислите планину. Вашу. Нешто конкретно — можда једну коју сте видјели, можда замишљену. Чврсту базу. Снажну средину. Врх у небу.",
     "Замислите да постајете ова планина. Ваше ноге су база. Ваш труп су падине. Ваша глава је врх.",
     "Сад замислите годишња доба како прелазе преко планине. Прољетна киша. Љетне олује. Јесењи вјетрови. Зимски снијег. Планина остаје. Увијек.",
     "Примијетите — вријеме се стално мијења. Планина се никад не мијења. Ви сте попут ње. Ваше емоције су вријеме. Ваше суштинско ја је планина.",
     "Кад дође хаос, вратите се овоме. Ви нисте олуја. Ви сте оно кроз шта олуја пролази. Стабилни. Укоријењени. Цјеловити."]
  ],
  meaning:[
    ["Шест животних подручја. Прочитајте их: Породица, Пријатељство, Посао/Учење, Здравље, Допринос другима, Духовност/смисао.",
     "Изаберите ЈЕДНО подручје које вам дјелује најважније управо сада. Само једно.",
     "Питајте се: 'Кад бих савршено живио/ла ову вриједност, како би изгледао мој живот за 5 година?' Будите конкретни. Не магловито.",
     "Сад упоредите са данас. Гдје је јаз? Не осуђујте — само примијетите.",
     "Која ЈЕДНА мала акција ове седмице би смањила тај јаз за 1%? Мање је боље.",
     "Вриједности су правац, не одредиште. Не долазите до њих. Ходате према њима, и ходање је смисао."],
    ["Замислите себе са 80 година. Проживјели сте пун живот. Сједите негдје мирно, гледате уназад.",
     "Из те перспективе, погледајте ВАС од данас. Вас који ово управо читате.",
     "Шта вам ваше ја од 80 година жели рећи? О бризи која вас троши? О људима у вашем животу? О ономе чега се држите, чему се опирете?",
     "Сад напишите писмо. Чак и само 3 реченице. Шта старији ви каже? Шта желе да знате?",
     "Примијетите — ваше ја од 80 година има перспективу коју ви сада немате. Та перспектива је стварна. Постоји. Можете је посудити.",
     "Прочитајте писмо кад заглавите. Будуће ја навија за садашње ја. Чак и кад то не можете видјети."],
    ["Стоици су носили овај подсјетник: 'Мементо мори' — сјети се да ћеш умријети. Није морбидно. Ослобађајуће.",
     "Паузирајте. Управо сада. Удахните. Умријет ћете једног дана. Можда за 60 година. Можда за 60 дана. Не знате.",
     "Погледајте бригу која вас сада троши. Хоће ли бити важна на ваш задњи дан? Будите искрени. Неке ће. Многе неће.",
     "Ствари које ЋЕ бити важне: људи које сте вољели, ствари које сте створили, како сте се понашали према другима, како сте се понашали према себи.",
     "Ствари које НЕЋЕ бити важне: већина онога што сте скроловали, већина поређења, већина малих незадовољстава, већина перфекционизма.",
     "Ово није песимизам. Супротно је. Знање да је вријеме коначно чини обично драгоцјеним. Искористите га добро данас."],
    ["DBT учи да постоје три ума у нама. Управо сада, идентификујте који је најгласнији.",
     "Емоционални ум: води се осјећајима. 'МРЗИМ ово. ЖЕЛИМ то. НЕ МОГУ то издржати.' Све истина. Све емоција.",
     "Разумски ум: води се логиком. 'Статистика каже. Про и контра. Треба и не треба.' Све истина. Све хладно.",
     "Мудри ум је интеграција. Не компромис — дубље мјесто гдје се оба поштују. И ваши осјећаји и ваше чињенице.",
     "Пронађите Мудри ум питањем: 'Шта најдубљи дио мене зна о овоме?' Сачекајте. Не форсирајте одговор.",
     "Одговор често стиже тихо. Не гласно као емоција. Не круто као разум. Само истинито. То је Мудри ум. Вјерујте му."],

function scoreLabel(type,score){
  if(type==="GAD-7"){
    if(score<=4) return{text:"Minimal",c:"var(--good)"};
    if(score<=9) return{text:"Mild",c:"var(--mid)"};
    if(score<=14) return{text:"Moderate",c:"var(--warm)"};
    return{text:"Severe",c:"var(--danger)"};
  }
  if(type==="PHQ-9"){
    if(score<=4) return{text:"Minimal",c:"var(--good)"};
    if(score<=9) return{text:"Mild",c:"var(--mid)"};
    if(score<=14) return{text:"Moderate",c:"var(--warm)"};
    if(score<=19) return{text:"Mod. Severe",c:"var(--danger)"};
    return{text:"Severe",c:"var(--danger)"};
  }
  if(score<=13) return{text:"Low",c:"var(--good)"};
  if(score<=26) return{text:"Moderate",c:"var(--mid)"};
  return{text:"High",c:"var(--danger)"};
}

      {"naslov": "Молитва Светог Филарета Московског", "napomena": "Молитва потпуног предања вољи Божијој — нарочито у данима бриге и страха.", "tekst": "Господе, не знам шта да иштем од Тебе. Ти једини знаш шта ми је потребно. Ти ме волиш више него што ја умијем себе да волим. Оче, дај слузи Своме оно што ја сам не умијем да искам.\nНе усуђујем се да тражим ни крст ни утјеху; само стојим пред Тобом. Срце ми је отворено; Ти видиш потребе које ја не знам. Види, и учини са мном по милости Својој.\nПорази и исцијели, обори и подигни ме. Благоговим и ћутим пред Твојом светом вољом и Твојим за мене недокучивим судовима. Себе Теби приносим на жртву. Предајем Ти се. Немам друге жеље осим жеље да испуним вољу Твоју.\nНаучи ме да се молим. Ти Сам у мени моли се. Амин."},
      {naslov:'Молитва Оптинских стараца',napomena:'За почетак дана.',tekst:'Господе, дај ми да са душевним миром дочекам све што ће ми донијети овај дан. Дај ми да се потпуно предам вољи Твојој светој. У сваком часу овога дана упућуј ме и подржи ме у свему. Какве год вијести да примим у току дана, научи ме да их примим мирне душе и са чврстим увјерењем да је на све воља Твоја света.\nРуководи мојим мислима и осјећањима у свим ријечима и дјелима мојим. У свим непредвиђеним случајевима не дај ми да заборавим да је све од Тебе послато. Научи ме да право и разборито поступам са сваким чланом моје породице, никога не огорчавајући и не жалостећи.\nГосподе, дај ми снаге да поднесем умор овога дана и све догађаје у току дана. Руководи вољом мојом и научи ме да се молим, да вјерујем, да се надам, да трпим, да праштам и да волим. Амин.'},
      {"naslov": "Молитва за живе", "napomena": "На мјесту (имена) додајте имена својих ближњих.", "tekst": "Спаси, Господе, и помилуј оца мога духовног (име), родитеље моје (имена), сроднике, кумове, пријатеље и све који ми добро чине, и све православне хришћане. Болеснима подај исцјељење, тужнима утјеху, онима у невољи помоћ, а свима нама опроштај гријехова и спасење душе."},
      {"naslov": "Молитва за упокојене", "tekst": "Упокој, Господе, душе уснулих слугу Твојих (имена), и свих од вијека уснулих отаца и браће наше, и опрости им сва сагрјешења, вољна и невољна, и даруј им Царство небеско. Вјечан им спомен."},
      {naslov:'Молитва Пресветој Богородици',tekst:'Богородице Дјево, радуј се, благодатна Марија, Господ је с тобом; благословена си ти међу женама и благословен је плод утробе твоје, јер си родила Спаса душа наших.'},
      {naslov:'',tekst:'Молитвама светих отаца наших, Господе Исусе Христе, Боже наш, помилуј нас. Амин.'}
    ]
  },
  vecernje:{
    naslov:'Вечерње молитве',
    uvod:'Дан се завршава. Оставите га у Божје руке — и добро и лоше.',
    pocetne:true,
    stavke:[
      {naslov:'Испитивање савјести',tip:'tisina',tekst:'Прије молитве, у тишини се сјетите дана.\nГдје сам данас осјетио мир? За шта могу да захвалим?\nГдје сам изгубио мир? Кога сам повриједио ријечју, мишљу или дјелом?\nКоме треба да опростим, а од кога да тражим опроштај?\nНе осуђујте себе и не правдајте се. Само уочите — и предајте Богу.'},
      {"naslov": "Молитва Светог Макарија Великог", "napomena": "Вечерња молитва.", "tekst": "Вјечни Боже и Царе свакога створења, Који си ме удостојио да доживим до овога часа, опрости ми гријехе које учиних данас дјелом, ријечју и мишљу, и очисти, Господе, смирену душу моју од сваке нечистоте тијела и духа.\nИ дај ми, Господе, да ову ноћ проведем у сну мирно, да бих, уставши са смиреног одра свога, угађао пресветом имену Твоме у све дане живота свога, и побиједио непријатеље који ратују против мене, тјелесне и бестјелесне.\nИ избави ме, Господе, од сујетних помисли које ме скрнаве, и од злих жеља. Јер је Твоје Царство и сила и слава, Оца и Сина и Светога Духа, сада и увијек и у вијекове вијекова. Амин."},
      {"naslov": "Из молитве Светог Јована Златоустог", "napomena": "Одломак — кратке молбе које се могу изговарати полако, једна по једна.", "tekst": "Господе, не лиши ме небеских Твојих добара.\nГосподе, избави ме од вјечних мука.\nГосподе, ако сагријеших умом или мишљу, ријечју или дјелом, опрости ми.\nГосподе, избави ме од сваког незнања и заборава, и малодушности, и окамењене безосјећајности.\nГосподе, избави ме од сваког искушења.\nГосподе, просвијетли срце моје које је помрачила зла жеља.\nГосподе, ја као човјек сагријеших, а Ти као Бог милосрдни помилуј ме, видећи немоћ душе моје.\nГосподе, пошаљи благодат Твоју у помоћ мени, да прославим име Твоје свето.\nГосподе Исусе Христе, упиши мене, слугу Твога, у књигу живота и даруј ми добар крај.\nГосподе, дај ми сузе и сјећање на смрт и умиљење.\nГосподе, дај ми смиреноумље, чедност и послушност.\nГосподе, дај ми трпљење, великодушност и кротост.\nГосподе, усади у мене коријен добра — страх Твој у срце моје.\nГосподе, удостој ме да Те љубим из све душе своје и мисли, и да у свему чиним вољу Твоју."},
      {"naslov": "Молитва за ближње", "tekst": "Онима који нас мрзе и вријеђају опрости, Господе Човјекољупче. Онима који нам добро чине, добро учини. Браћи и сродницима нашим подај што траже за спасење и живот вјечни. Болесне посјети и исцијели. Путницима буди сапутник. Онима који нам служе и милостињу дају, опрости гријехе.\nСјети се, Господе, уснулих отаца и браће наше, и упокој их гдје сија свјетлост лица Твога.\nСјети се, Господе, и нас смирених, грешних и недостојних слугу Твојих, и просвијетли ум наш свјетлошћу познања Твога, и упути нас на стазу заповијести Твојих, молитвама Пречисте Владичице наше Богородице и свих Твојих светих. Амин."},
      {naslov:'Молитва Светом Анђелу Чувару',tekst:'Анђеле Христов, чувару мој свети и заштитниче душе и тијела мога, опрости ми све што сагријеших данас, и од сваког лукавства непријатеља мога избави ме, да ни у једном гријеху не прогњевим Бога мога; него моли се за мене грешног и недостојног слугу, да ме покажеш достојним благости и милости Свесвете Тројице и Матере Господа мога Исуса Христа и свих светих. Амин.'},
      {naslov:'Молитва Пресветој Богородици',tekst:'Достојно је заиста да те блаженом зовемо, Богородице, увијек блажена и пренепорочна и Мати Бога нашега. Часнија од херувима и неупоредиво славнија од серафима, која си без истљења родила Бога Логоса, ти си заиста Богородица, тебе величамо.'},
      {"naslov": "Молитва Светог Јоаникија", "tekst": "Нада моја је Отац, уточиште моје Син, заштита моја Дух Свети. Тројице Света, слава Теби."},
      {naslov:'Пред спавање',napomena:'Прекрстите постељу и себе.',tekst:'У руке Твоје, Господе Исусе Христе, Боже мој, предајем дух свој. Ти ме благослови, Ти ме помилуј и живот вјечни ми даруј. Амин.'},
      {naslov:'',tekst:'Молитвама светих отаца наших, Господе Исусе Христе, Боже наш, помилуј нас. Амин.'}
    ]
  },
  oci:{
    naslov:'Свети Оци о души',
    uvod:'О тузи, унинију, страху и болести душе — од древних Отаца до светих стараца нашега доба.',
    pocetne:false,
    stavke:[
      {naslov:'Прије читања',tip:'tisina',tekst:'Свети Оци нису знали за данашње дијагнозе, али су пажљиво описали стања која и ми препознајемо: тугу, униније, страх и узнемиреност. Њихово искуство је драгоцјено — али не замјењује лијечење.\nРијечи Светог Писма наводимо дословно. Учење древних Отаца дајемо у сажетку, а ријечи савремених стараца у преводу, увијек са назнаком дјела у коме се налазе.'},
      {naslov:'Туга по Богу и туга овога свијета',tip:'clanak',citat:'Јер жалост која је по Богу доноси покајање за спасење, за које се не каје; а жалост овога свијета доноси смрт.',izvor:'2. посланица Коринћанима 7, 10',tekst:'Апостол разликује двије туге. Преподобни Јован Касијан ову мисао развија: туга која је од Бога је кротка, смирена и пуна наде — она човјека отвара према Богу и људима. Друга туга је горка, безнадежна и затвара човјека у самог себе.\nЗато је корисно питати се: води ли ме моја туга ка Богу и ближњима, или ме гаси и одваја од свих? Ако је ово друго — то није од Бога, и треба потражити помоћ.',djelo:'Јован Касијан, Установе киновија, књига 9 (О тузи)'},
      {naslov:'Униније — „подневни демон“',tip:'clanak',tekst:'Евагрије Понтијски униније (грч. акидија) назива најтежим од свих помисли, јер не напада један дио душе него читаву душу. Описује га веома живо: око поднева вријеме као да стоји, дан изгледа бескрајно дуг, човјек гледа кроз прозор, мрзи мјесто на коме јесте и посао који ради, и жели да буде било гдје другдје.\nУ томе данас препознајемо много од онога што називамо апатијом, губитком смисла и тежином депресије. Евагрије савјетује да се у тренутку искушења не бјежи — да се остане, са трпљењем, јер униније пролази, а за њим долази мир.',djelo:'Евагрије Понтијски, Практикос, гл. 12 и 28'},
      {naslov:'Ради и моли се',tip:'clanak',tekst:'Преподобни Антоније Велики, док је живио у пустињи, једном је био обузет унинијем и тмурним мислима. Помолио се Богу да му покаже како да се спасе. Тада је угледао некога налик себи како сједи и ради, па устане и моли се, па опет сједне и ради. Био је то анђео, који му је рекао да чини тако и да ће се спасти.\nОвај савјет је једноставан и дубок: када душа клоне, не треба чекати да се осјећамо боље. Мали ритам рада и молитве — корак по корак — враћа снагу. Исто ово данас препоручује и психологија (бихејвиорална активација у КБТ вјежбама).',djelo:'Изреке пустињских отаца, Антоније Велики, 1'},
      {naslov:'Како се униније побјеђује',tip:'clanak',tekst:'Свети Јован Лествичник униније описује као опуштеност душе и одсуство воље за било шта. Као лијек наводи рукодјеље — рад рукама, сјећање на смрт и на будућа добра, и трпљење.\nНије случајно што Оци увијек спајају тијело и душу: када ум не може да се покрене, руке и мала дјела могу да га повуку напријед.',djelo:'Свети Јован Лествичник, Лествица, 13. степен'},
      {naslov:'Страх и брига',tip:'clanak',citat:'У љубави нема страха, него савршена љубав изгони страх напоље.',izvor:'1. Јованова посланица 4, 18',tekst:'Оци уче да се страх и брига не побјеђују напором воље, него повјерењем — предавањем себе и својих ближњих у руке Божије. Савјет „не брините се за сутра“ (Мт 6, 34) не значи немар, него да живимо данашњи дан и да не носимо унапријед терет који још није дошао.\nКратка Исусова молитва, коју су исихасти вјековима понављали са пажњом, враћа ум из узнемирених мисли у садашњи тренутак. За то служи и Бројаница у овој апликацији.',djelo:'Добротољубље — учење исихаста о умној молитви'},
      {naslov:'Када је туга болест',tip:'clanak',tekst:'Свети Јован Златоусти је из изгнанства писао ђаконици Олимпијади, која је трпјела тешку малодушност. Он је не прекорева и не говори јој да је њена туга гријех. Стрпљиво је тјеши, објашњава јој шта се у души дешава и учи је како да носи страдање.\nИ сам Златоусти је умро у тешким страдањима, изговарајући: „Слава Богу за све!“',djelo:'Свети Јован Златоусти, Писма Олимпијади (404–407)'},
      {naslov:'Љекар је дар Божији',tip:'clanak',tekst:'Свети Василије Велики учи да је љекарска вјештина дар Божији. Користити је није супротно вјери — само не треба сву наду полагати у њу, него и у њој видјети Божје старање. Књига Премудрости Исуса сина Сирахова (38. глава) такође учи да се поштује љекар и да је Господ створио лијекове из земље.\nЗато лијечење код психијатра или психолога, па и лијекови, нису знак маловјерја. Као што се болесно тијело лијечи, лијечи се и болест која погађа ум и расположење — уз молитву и Свете Тајне.',djelo:'Свети Василије Велики, Пространа правила, одговор 55'},
      {"naslov": "Савремени старци и богослови", "tip": "tisina", "tekst": "Свети старци нашега времена и православни богослови који су уједно љекари и психотерапеути говорили су о тузи, унинију и страху језиком блиским данашњем човјеку.\nРијечи старца Порфирија, старца Пајсија и Светог Јована Кронштатског наводимо у нашем преводу са руског издања, уз тачну назнаку књиге и поглавља."},
      {"naslov": "Старац Порфирије — отвори прозор свјетлости", "tip": "clanak", "citat": "Не труди се да из себе истјераш зло које је у теби. Боље отварај врата да уђе свјетлост.", "izvor": "Старац Порфирије", "tekst": "Старац Порфирије је учио да се тама не побјеђује борбом са тамом. Каже: „Отвори прозор да у собу уђе свјетлост, и тама ће сама отићи.“ И додаје: „А свјетлост је Христос.“\nОво је велика утјеха за онога ко пати од тмурних мисли: не морамо се исцрпљивати борећи се са сваком од њих. Довољно је окренути се ка ономе што је добро — молитви, љепоти, љубави према ближњем — и пустити да свјетлост ради своје.", "djelo": "Старац Порфирије, Цвијетослов савјета, поглавље „Радост — свјетлост“"},
      {"naslov": "Старац Порфирије — нема мјеста очајању", "tip": "clanak", "citat": "Жив је Бог. Када изгубиш сваку наду, Он ти пошаље нешто што уопште не очекујеш.", "izvor": "Старац Порфирије", "tekst": "Старац разликује покајање од унинија: „Једно је униније, а друго покајање.“ Покајање је свијетло и води напријед; униније гризе и затвара човјека у самог себе. Зато савјетује: „Када сагријешиш, не очајавај.“\nИ још: „Када си у Цркви, нема мјеста очајању, ма шта да си учинио, ма шта да ти се догодило.“\nКада наиђу униније и туга, старац није савјетовао само молитву него и покрет — да се одмах устане и изађе у шетњу, у природу.", "djelo": "Старац Порфирије, Цвијетослов савјета, поглавља „Безнађе — униније — жалости“ и „Жалости — униније — стрес“"},
      {"naslov": "Старац Пајсије — повјерење умјесто бриге", "tip": "clanak", "citat": "Када се потпуно предаш Богу, тада ти више нема потребе да за нешто молиш или да се бринеш.", "izvor": "Старац Пајсије Светогорац", "tekst": "Старац Пајсије каже кратко: „Молитва је повјерење Богу.“ Бриге, по његовим ријечима, расијавају ум и сметају молитви. Зато предлаже да Богу оставимо да Сам дјелује, и да за све славимо Бога.\nО тешким стањима униније и туге старац учи да се са њима човјек не може борити сам. Потребни су му духовник, Црква и људи који га воле.", "djelo": "о. Дионисије Тацис, Када туђи бол постане свој (поуке старца Пајсија), гл. 3"},
      {"naslov": "Старац Пајсије — добре помисли", "tip": "clanak", "tekst": "У књизи „Духовна борба“ старац Пајсије стално говори о добрим помислима. Свака ситуација се може тумачити на добро или на зло, а од тумачења зависи мир душе. Ко се научи да у свему тражи добар смисао и корист за душу, тај се ослобађа многих брига, несанице и душевних мука, о којима старац у тој књизи говори.\nСтарац при томе није тражио само слушање. Тражио је да се поука примијени у животу, свакога дана.\nОво је веома блиско ономе што данас КБТ назива преиначењем мисли: умјесто „све иде наопако“, учимо се да питамо „шта ми Бог овим показује и шта добро могу из овога да извучем?“", "djelo": "Старац Пајсије Светогорац, Поуке, том III: Духовна борба"},
      {"naslov": "Митрополит Јеротеј — Црква као болница", "tip": "clanak", "citat": "Такозвани психолошки проблеми јесу у ствари проблеми помисли, помрачења ума и нечистог срца.", "izvor": "Митрополит Навпактски Јеротеј (Влахос)", "tekst": "У књизи „Православна психотерапија“, по којој и ова апликација носи свој поднаслов, митрополит Јеротеј показује да је Православље у својој суштини лијечење душе. Црква је, по Оцима, лјечилиште, а Свете Тајне и подвиг су лијекови: чишћење срца, просвјетљење ума и сједињење са Богом.\nМитрополит при томе изричито каже да овакав приступ не одбацује ни психијатрију ни тјелесну медицину. Он говори о дубљем, духовном коријену човјекове муке.", "djelo": "Митрополит Јеротеј (Влахос), Православна психотерапија, Увод"},
      {"naslov": "Жан-Клод Ларше — разликовати болести", "tip": "clanak", "tekst": "Француски православни богослов Жан-Клод Ларше проучио је шта Оци Истока уче о душевним болестима. Показао је да су Оци разликовали више поријекла тих болести: неке потичу од тијела, неке од демонског дејства, а неке од страсти која је узела маха у души.\nЗа нас је ово важно јер значи да свака душевна болест није гријех нити знак слабе вјере. Многе имају и тјелесни узрок, и тада им је потребно и љекарско лијечење, као и свакој другој болести. Мудрост је у разликовању, а то разликовање чине заједно духовник и љекар.", "djelo": "Жан-Клод Ларше, Душевни поремећаји и духовно исцјељење (Mental Disorders and Spiritual Healing)"},
      {"naslov": "Владета Јеротић — вјера и психотерапија", "tip": "clanak", "tekst": "Академик Владета Јеротић био је психијатар и психотерапеут, и уједно православни хришћанин и писац. Више од деценије је на Православном богословском факултету у Београду предавао пасторалну психологију.\nЦијелог живота је показивао да психотерапија и вјера нису непријатељи. То показују и наслови његових књига: „Неуроза као изазов“, „Психотерапија и религија“ и „50 питања и 50 одговора из хришћанско-психотерапеутске праксе“. Његов примјер нас учи да је могуће бити и вјерник и пацијент, и да једно не умањује друго.", "djelo": "Владета Јеротић, Психотерапија и религија; 50 питања и 50 одговора"},
      {naslov:'Шта нам Оци поручују данас',tip:'lista',lista:['Туга није гријех. Униније се не побјеђује осуђивањем себе, него трпљењем и малим корацима.','Не остајте сами: исповиједите се, разговарајте са духовником и са блиским људима.','Држите ритам дана — мало рада, мало молитве, па опет рад (Антоније Велики).','Тијело и душа су једно: сан, храна, кретање и свјетлост дана нису споредни.','Ако туга или страх трају дуже од двије седмице, ако су ту несаница, губитак апетита или мисли о смрти — обратите се љекару. То је мудрост, а не маловјерје.','Ако имате мисли о самоубиству, одмах позовите Плави телефон 080 05 03 05 или Хитну помоћ 124. Нисте сами.']}
    ]
  },
  ispovijest:{
    naslov:'Исповијест и Причешће',
    uvod:'Двије Свете Тајне које лијече душу и сједињују нас са Христом.',
    pocetne:false,
    stavke:[
      {naslov:'Исповијест — Света Тајна покајања',tip:'clanak',tekst:'Исповијест је Света Тајна у којој нам Бог, кроз свештеника, опрашта гријехе које искрено исповиједимо. Покајање — грчки метаноја — значи промјену ума: окретање од гријеха ка Богу.\nТо није суд над човјеком, него лијечење душе. Свештеник је свједок, а Онај Који опрашта јесте Христос. Зато се на исповијест не иде са страхом од осуде, него са надом у милост.',citat:'Ако исповиједамо гријехе своје, вјеран је и праведан да нам опрости гријехе и очисти нас од сваке неправде.',izvor:'1. Јованова посланица 1, 9'},
      {naslov:'Зашто је важна за душевни мир',tip:'clanak',tekst:'Гријех који носимо у себи, неизговорен, оптерећује савјест и помрачује радост. Када га изговоримо пред Богом, престаје да нама тајно влада. Многи послије исповијести осјете олакшање — као да им је скинут терет за који нису ни знали колико је тежак.\nРедовна исповијест учи нас искрености према себи: да видимо своје слабости без порицања, али и без очаја.'},
      {naslov:'Исповијест и психотерапија',tip:'clanak',tekst:'Исповијест и психотерапија нису исто, и једно не замјењује друго. Психотерапија помаже код душевних тешкоћа — анксиозности, депресије, трауме. Исповијест лијечи однос човјека са Богом кроз покајање и опроштај гријехова.\nЗдраво осјећање кривице води покајању и миру. Ако, међутим, мисли о гријеху не престају ни послије исповијести — ако се стално враћају и мучите се питањем да ли сте све рекли — разговарајте о томе са својим духовником, а по потреби и са психологом. То може бити скрупулозност, која се лијечи и молитвом и стручном помоћи.'},
      {naslov:'Како се припремити за исповијест',tip:'lista',lista:['Помолите се Богу да вам открије ваше гријехе и да вам да искрено покајање.','Испитајте савјест — уз Десет Божијих заповијести и Блаженства. Можете записати оно чега се сјетите.','Помирите се са онима са којима сте у свађи, колико је до вас.','На исповијести говорите једноставно и искрено — без правдања себе и без оптуживања других.','Послије исповијести примите опроштај. Не враћајте се на оно што је Бог опростио.']},
      {naslov:'Свето Причешће',tip:'clanak',tekst:'Свето Причешће је средиште хришћанског живота. У Светој Литургији хљеб и вино постају Тијело и Крв Христова, и ми се сједињујемо са Христом — не символично, него стварно.\nПричешће није награда за оне који су постали савршени, него лијек и храна за оне који се боре. Свети Игњатије Богоносац назива га „лијеком бесмртности“ (Посланица Ефесцима, 20).',citat:'Који једе моје тијело и пије моју крв стоји у мени и ја у њему.',izvor:'Јеванђеље по Јовану 6, 56'},
      {"naslov": "На исцјељење душе и тијела", "tip": "clanak", "citat": "Да ми не буде на суд или на осуду причешће Светих Твојих Тајни, Господе, него на исцјељење душе и тијела.", "izvor": "Молитва пред Свето Причешће", "tekst": "Црква се пред Чашом не моли само за душу, него и за тијело, јер је човјек једна цјелина. Ако је душа болесна, пати и тијело; ако је тијело болесно, пати и душа. Христос је лијечио цијелог човјека, и у Причешћу нам даје Себе Цијелог.\nЗато се Причешће од давнина назива лијеком. Ако сте болесни и не можете у храм, свештеник може доћи да вас причести код куће или у болници. Довољно је да га позовете."},
      {"naslov": "Свети Јован Кронштатски", "tip": "clanak", "tekst": "Као дјечак од десетак година, Јован је тешко учио у школи и био је у очајању. Једне ноћи клекнуо је и усрдно се помолио. Касније је то описао овако: „Као да је вео пао са мојих очију, као да ми се ум отворио.“ Од тада је учење ишло лако.\nКао свештеник у Кронштату служио је Свету Литургију свакога дана и свакога дана се причешћивао. Позивао је народ да се покаје и да се чешће причешћује. Многи су промијенили живот и почели редовно и радосно да приступају Чаши.\nДар исцјељења, како је сам причао свештеницима, почео је скромно. Неко се у Кронштату разболио, и једна побожна старица је упорно тражила од оца Јована да се моли за болесниково оздрављење. Он се помолио и болесник је оздравио. Послије другог таквог случаја схватио је да му је то, по његовим ријечима, „ново послушање од Бога — да се молим за оне који то буду тражили“. Његови биографи бијележе да му је Света Литургија била главно средство исцјељења.", "djelo": "Житије Светог Јована Кронштатског; Бесједа оца Јована са пастирима"},
      {"naslov": "Из дневника „Мој живот у Христу“", "tip": "clanak", "citat": "…од примања Светих Тајни одједном ћеш се смирити, развеселити и оживјети.", "izvor": "Свети Јован Кронштатски, Мој живот у Христу, бр. 330", "tekst": "Свети Јован пише да онај ко приступа Чаши са вјером и правилним расположењем срца осјети у срцу да Господ заиста пребива у њему, и он у Господу.\nО дејству Светих Тајни свједочи из свог искуства: „И све је то пред мојим очима; и ја то осјећам душом и тијелом, живо осјећам“ (бр. 318). А за Свете Тајне и молитве Цркве уопште каже да нас „избављају од срдачних туга и тјелесних болести“ (бр. 361)."},
      {"naslov": "Причешће и утучен дух", "tip": "clanak", "citat": "Дивим се величини и животворности Божанствених Тајни.", "izvor": "Свети Јован Кронштатски, Мој живот у Христу, бр. 881", "tekst": "Отац Јован у дневнику биљежи како је причестио старицу која је искашљавала крв и није могла да једе, и тешко болесну дјевојку која је једва била при свијести. Обје су почеле да се опорављају истога дана.\nНа другом мјесту (бр. 900) пише нешто што је блиско свакоме ко пати од туге. Често му се дешавало да послије Причешћа или усрдне молитве код куће, када су га притискали гријех, туга или тјескоба, Бог његов утучени, тмурни, немоћни и тупи дух замијени чистим, добрим и свијетлим духом. Запис завршава ријечима: „Слава сили Твојој, Господе! Слава благости Твојој, Господе!“\nИсти светитељ искрено пише и да послије мира код Чаше могу опет доћи борба и туга (бр. 302). Причешће није чаробни лијек који брише сваку муку. Оно је Христос Који улази у нашу муку и носи је са нама. Зато се лијечење код љекара и Причешће не искључују, него иду заједно."},
      {naslov:'Како се припремити за Причешће',tip:'lista',lista:['Припрему договорите са својим духовником — он ће вам, према вашем животу и здрављу, рећи како да постите и колико често да приступате.','Уобичајено је: пост, исповијест, читање молитава пред Причешће и да се од поноћи не једе и не пије.','Помирите се са свима. Христос нас учи да се прво помиримо са братом својим, па тек онда принесемо дар (Мт 5, 23–24).','Послије Причешћа сачувајте мир: прочитајте благодарне молитве, избјегавајте свађу и празне разговоре.']},
      {naslov:'Ако дуго нисте били',tip:'clanak',tekst:'Не стидите се и не одлажите. Јавите се свештенику у својој парохији и реците му да желите да се исповиједите. Сваки повратак је радост — „тако ће бити радост на небу за једнога гријешника који се каје“ (Лк 15, 7).'}
    ]

// BROJANICA — virtuelna brojanica od 33 čvorića
// Molitva: Господе Исусе Христе, Помилуј ме (Isusova molitva)
// ═══════════════════════════════════════════════════════════════
function Brojanica({onBack}){
  const[currentBead,setCurrentBead]=useState(0);
  const[krugova,setKrugova]=useState(()=>store.get('brojanica_krugova')||0);
  const[sesijaKrugova,setSesijaKrugova]=useState(0);
  const[zvukOn,setZvukOn]=useState(true);
  const[showMolitva,setShowMolitva]=useState(true);
  const audioCtx=useRef(null);

  // Diskretan "klik" zvuk pri svakom čvoru
  const playClick=()=>{
    if(!zvukOn)return;
    try{
      if(!audioCtx.current)audioCtx.current=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=audioCtx.current;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.frequency.value=180;
      gain.gain.setValueAtTime(0.08,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start();osc.stop(ctx.currentTime+0.08);
    }catch(e){}
  };

  const sljedeci=()=>{
    playClick();
    const n=currentBead+1;
    if(n>=33){
      // Jedan krug završen
      setCurrentBead(0);
      setSesijaKrugova(sesijaKrugova+1);
      const noviUkupno=krugova+1;
      setKrugova(noviUkupno);
      store.set('brojanica_krugova',noviUkupno);
    }else{
      setCurrentBead(n);

  if (!text) return false;

// SOUNDSCAPE ENGINE (Web Audio API — zero files, pure synthesis)
// ═══════════════════════════════════════════════════════════════
const AudioEngine = {
  ctx: null,
  master: null,
  nodes: {},
  
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
  },
  
  resume() { if (this.ctx?.state === 'suspended') this.ctx.resume(); },
  
  setMaster(v) { if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3); },
  
  // ── Rain: filtered white noise with gentle modulation ──
  startRain(vol = 0.5) {
    this.init(); this.stopSound('rain');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 0.7;
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 200;
    const gain = this.ctx.createGain(); gain.gain.value = vol;
    // Gentle rain modulation
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.15; lfoGain.gain.value = 200;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();
    src.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.rain = { src, gain, lfo, lp, hp, lfoGain };
  },
  
  // ── Ocean: layered filtered noise with slow wave rhythm ──
  startOcean(vol = 0.4) {
    this.init(); this.stopSound('ocean');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.3;
    const gain = this.ctx.createGain(); gain.gain.value = 0;
    // Wave rhythm: slow volume swell
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.08; lfoGain.gain.value = vol * 0.5;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    gain.gain.setValueAtTime(vol * 0.5, this.ctx.currentTime);

    const lfo2 = this.ctx.createOscillator();
    const lfo2Gain = this.ctx.createGain();

    lfo2.connect(lfo2Gain); lfo2Gain.connect(bp.frequency);
    lfo.start(); lfo2.start();
    src.connect(bp); bp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.ocean = { src, gain, lfo, lfo2, bp, lfoGain, lfo2Gain };
  },
  
  // ── Wind: very low filtered noise ──
  startWind(vol = 0.3) {
    this.init(); this.stopSound('wind');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 300;
    const gain = this.ctx.createGain(); gain.gain.value = vol;
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.05; lfoGain.gain.value = 150;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();
    src.connect(lp); lp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.wind = { src, gain, lfo, lp, lfoGain };
  },
  
  // ── Ambient Drone: layered sine/triangle oscillators with detune ──
  startDrone(vol = 0.25) {
    this.init(); this.stopSound('drone');

      const osc = this.ctx.createOscillator();
      osc.type = i % 2 === 0 ? 'sine' : 'triangle';

      return osc;
    });
    const gain = this.ctx.createGain(); gain.gain.value = 0;

    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.03; lfoGain.gain.value = vol * 0.15;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    lfo.start();
    oscs.forEach(o => { o.connect(gain); o.start(); });
    gain.connect(this.master);
    this.nodes.drone = { oscs, gain, lfo, lfoGain };
  },
  
  // ── Binaural Beats: two sine waves with frequency offset ──
  startBinaural(vol = 0.2, type = 'theta') {
    this.init(); this.stopSound('binaural');

    oscR.connect(gainR); gainR.connect(merger, 0, 1);
    merger.connect(this.master);
    oscL.start(); oscR.start();
    this.nodes.binaural = { oscL, oscR, gainL, gainR, merger, type };
  },
  
  // ── Singing Bowl: decaying sine with harmonics ──
  playBowl() {
    this.init();
    const freqs = [261.6, 523.3, 784.9]; // C overtone series
    freqs.forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = f;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.15 / (i + 1), this.ctx.currentTime);

      osc.connect(gain); gain.connect(this.master);
      osc.start(); osc.stop(this.ctx.currentTime + 8 + i * 2);
    });
  },
  
  setVolume(name, vol) {
    const n = this.nodes[name];
    if (n?.gain) n.gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.3);
    if (n?.gainL) { n.gainL.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.3); n.gainR.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.3); }
  },
  
  stopSound(name) {
    const n = this.nodes[name];
    if (!n) return;
    try {
      if (n.gain) n.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
      setTimeout(() => {
        try {
          if (n.src) n.src.stop();
          if (n.oscs) n.oscs.forEach(o => o.stop());
          if (n.oscL) { n.oscL.stop(); n.oscR.stop(); }
          if (n.lfo) n.lfo.stop();
          if (n.lfo2) n.lfo2.stop();
        } catch {}
        delete this.nodes[name];
      }, 800);
    } catch { delete this.nodes[name]; }
  },
  
  stopAll() { Object.keys(this.nodes).forEach(k => this.stopSound(k)); },
  
  isPlaying(name) { return !!this.nodes[name]; }
};

        t('All audio is synthesized in real-time using the Web Audio API — no files are downloaded or stored. Binaural beats require headphones: slightly different frequencies play in each ear, and your brain perceives the difference as a rhythmic pulse. Theta (5 Hz) promotes deep relaxation ideal for deep rest. Delta (2 Hz) aids sleep. Alpha (10 Hz) supports calm focus.'))),
    
    anyActive && React.createElement('button', { onClick: () => { AudioEngine.stopAll(); setActive({}); }, className: 'secondary-btn', style: { width: '100%' } }, t('Stop All Sounds'))
  );
}

const POKRETNI_CRVENI=[-7,0,1,2,39,49,50];
const MJ_J=['јануар','фебруар','март','април','мај','јун','јул','август','септембар','октобар','новембар','децембар'];
const DAN_MS=86400000;
const dan0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function poStarom(d){const j=new Date(d.getFullYear(),d.getMonth(),d.getDate()-13);return{m:j.getMonth()+1,d:j.getDate(),k:String(j.getMonth()+1).padStart(2,'0')+'-'+String(j.getDate()).padStart(2,'0')};}
function vaskrs(y){const a=y%4,b=y%7,c=y%19,dd=(19*c+15)%30,e=(2*a+4*b-dd+34)%7,mj=Math.floor((dd+e+114)/31),dn=((dd+e+114)%31)+1;return new Date(y,mj-1,dn+13);}
function post(d,j,diff){
  const jm=j.m,jd=j.d,wd=d.getDay();
  if((jm===12&&jd>=25)||(jm===1&&jd<=4))return{post:false,naziv:'Мрсни дани — од Божића до Крстовдана'};
  if(diff>=0&&diff<=6)return{post:false,naziv:'Свијетла седмица — без поста'};
  if(diff>=49&&diff<=55)return{post:false,naziv:'Седмица послије Духова — без поста'};
  if(diff>=-69&&diff<=-64)return{post:false,naziv:'Седмица митара и фарисеја — без поста'};
  if(diff>=-55&&diff<=-50)return{post:true,blag:true,naziv:'Бијела (сирна) седмица — без меса'};
  if(diff>=-48&&diff<=-8)return{post:true,naziv:'Велики (Васкршњи) пост'};
  if(diff>=-7&&diff<=-1)return{post:true,naziv:'Велики пост — Страсна седмица'};
  if(jm===1&&jd===5)return{post:true,naziv:'Крстовдан — пост уочи Богојављења'};
  if(jm===8&&jd===29)return{post:true,naziv:'Посни дан — Усековање'};
  if(jm===9&&jd===14)return{post:true,naziv:'Посни дан — Крстовдан'};
  if(diff>=57&&(jm<6||(jm===6&&jd<=28)))return{post:true,naziv:'Петровски пост'};
  if(jm===8&&jd>=1&&jd<=14)return{post:true,naziv:'Госпојински пост'};
  if((jm===11&&jd>=15)||(jm===12&&jd<=24))return{post:true,naziv:'Божићни пост'};
  if(wd===3)return{post:true,naziv:'Посни дан — сриједа'};
  if(wd===5)return{post:true,naziv:'Посни дан — петак'};
  return{post:false,naziv:'Мрсни дан'};
}
function crkveniDan(datum){
  const d=dan0(datum||new Date());const j=poStarom(d);
  const diff=Math.round((d-vaskrs(d.getFullYear()))/DAN_MS);
  const pokretni=POKRETNI[String(diff)]||null;
  const praznik=CRVENO_SLOVO[j.k]||null;
  const crveno=!!praznik||(pokretni&&POKRETNI_CRVENI.includes(diff))||d.getDay()===0&&false;
  return{d,j,diff,pokretni,praznik,crveno,narodni:NARODNI[j.k]||null,sveti:SVETITELJI[j.k]||[],post:post(d,j,diff)};
}
function datumSr(d,opts){const x=d.toLocaleDateString('sr-Cyrl-BA',opts||{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toLowerCase();return x.charAt(0).toUpperCase()+x.slice(1);}
function sljedeciPraznici(od,n){const out=[];const st=dan0(od);for(let i=1;i<400&&out.length<n;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i);const c=crkveniDan(d);if(c.crveno)out.push({d,naziv:(c.diff===0||POKRETNI_CRVENI.includes(c.diff))&&c.pokretni?c.pokretni:c.praznik,za:i});}return out;}

  const sun = isDark ? '#F5D88B' : '#F5D88B';
